name: Code Quality

on:
  push:
    branches: [main, dev]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.editorconfig'
  pull_request:
    branches: [main, dev]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore SolarBatteryMaintainance.slnx

      - name: Verify code formatting
        # --severity error: chỉ fail trên ERROR level (formatting rule + indent + brace).
        # KHÔNG fail trên WARN level (style suggestion như var preference) → tránh noise.
        # Project đã chạy `dotnet format` 1 lần để fix baseline.
        run: dotnet format SolarBatteryMaintainance.slnx --verify-no-changes --severity error --no-restore
