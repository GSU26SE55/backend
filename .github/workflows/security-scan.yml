name: Security Scan

on:
  # Scan trên main (gần production)
  push:
    branches: [main]
  # Scan PR tới main/dev — bắt CVE trước khi merge
  pull_request:
    branches: [main, dev]
  # Scan định kỳ thứ 2 hàng tuần — bắt CVE mới phát hiện trên dependencies cũ
  schedule:
    - cron: '0 8 * * 1'

# Cancel run cũ khi push commit mới
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'

jobs:
  # ============================================================
  # Trivy filesystem scan — bắt CVE trong dependencies + secret leak.
  # Chỉ FAIL trên CRITICAL, HIGH chỉ warn.
  # ============================================================
  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          # CRITICAL → fail PR. HIGH → warn (ignore-unfixed bỏ những CVE chưa có patch).
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          skip-dirs: '**/bin,**/obj,node_modules,.git'

      - name: Run Trivy (HIGH — warn only)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          severity: 'HIGH'
          exit-code: '0'  # KHÔNG fail
          ignore-unfixed: true
          format: 'table'
          skip-dirs: '**/bin,**/obj,node_modules,.git'

  # ============================================================
  # CodeQL — chậm (~5-10 phút), CHỈ chạy trên main hoặc lịch weekly.
  # KHÔNG chạy trên mỗi PR (tốn time).
  # ============================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution cho CodeQL
        run: |
          # CodeQL cần build C# project để analyze.
          for csproj in \
            services/AuthService/src/AuthService.Api/AuthService.Api.csproj \
            services/EmailService/src/EmailService.Api/EmailService.Api.csproj \
            services/SmsService/src/SmsService.Api/SmsService.Api.csproj \
            services/FileStorageService/src/FileStorageService.Api/FileStorageService.Api.csproj \
            services/ApiGateway/src/ApiGateway/ApiGateway.csproj; do
            dotnet build "$csproj" -c Release --no-incremental
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: csharp
