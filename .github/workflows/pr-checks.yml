name: PR Checks

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, reopened, synchronize]

# PR vào main/dev mới chạy. PR feature branch → feature branch khác KHÔNG trigger.

permissions:
  pull-requests: write
  contents: read

jobs:
  # ============================================================
  # Validate PR title (Conventional Commits).
  # ============================================================
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commit types được chấp nhận
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ============================================================
  # Project rule check — flag common bugs in diff.
  # ============================================================
  project-rule-check:
    name: Project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --no-tags --prune --depth=50 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check await on void Update/DeleteAsync
        run: |
          # Project rule: UpdateAsync/DeleteAsync return void → KHÔNG được await.
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.cs')
          if echo "$DIFF" | grep -E '^\+.*await\s+\w+(\.\w+)*\.(UpdateAsync|DeleteAsync)\s*\('; then
            echo "❌ Phát hiện 'await ...UpdateAsync(' hoặc 'await ...DeleteAsync(' — 2 method này void."
            echo "Bỏ 'await' trước UpdateAsync/DeleteAsync."
            exit 1
          fi
          echo "✅ Không có await trên void UpdateAsync/DeleteAsync"

      - name: Check await on IQueryable GetAllAsync
        run: |
          # Project rule: GetAllAsync trả IQueryable → KHÔNG await.
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.cs')
          if echo "$DIFF" | grep -E '^\+.*await\s+\w+(\.\w+)*\.GetAllAsync\s*\('; then
            echo "❌ Phát hiện 'await ...GetAllAsync(' — method trả IQueryable, không phải Task."
            exit 1
          fi
          echo "✅ Không có await trên GetAllAsync"

      - name: Check Entity extends AuditableEntity
        run: |
          # Project rule: mọi entity trong Domain/Entities phải extend AuditableEntity.
          NEW_ENTITIES=$(git diff origin/${{ github.base_ref }}...HEAD --name-only --diff-filter=A | grep -E 'Domain/Entities/.*\.cs$' || true)
          FAILED=0
          for file in $NEW_ENTITIES; do
            if [ -f "$file" ] && ! grep -qE 'class\s+\w+\s*:\s*(\w+\s*,\s*)*AuditableEntity' "$file"; then
              # Cho phép class abstract hoặc enum
              if ! grep -qE '^(\s*public\s+)?(abstract|enum|interface)' "$file"; then
                echo "❌ $file: entity mới phải extend AuditableEntity"
                FAILED=1
              fi
            fi
          done
          [ $FAILED -eq 0 ] && echo "✅ Tất cả entity mới extend AuditableEntity" || exit 1

  # ============================================================
  # PR size check — quá lớn = khó review.
  # ============================================================
  pr-size:
    name: PR size warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --no-tags --prune --depth=50 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check PR size
        run: |
          ADDED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          DELETED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          TOTAL=$((ADDED + DELETED))
          echo "PR diff: +$ADDED -$DELETED (total $TOTAL lines)"
          if [ $TOTAL -gt 1500 ]; then
            echo "::warning::PR quá lớn ($TOTAL dòng). Cân nhắc tách thành nhiều PR nhỏ hơn để dễ review."
          fi
