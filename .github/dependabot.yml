version: 2

updates:
  # ============================================================
  # NuGet packages — update mỗi tuần.
  # ============================================================
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Microsoft.Extensions.* — giữ cùng major với .NET runtime hiện tại.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      # ASP.NET Core + EF Core — riêng vì major bump dễ break, cần review kỹ
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
      # Test packages — risk thấp, dễ batch update
      test-packages:
        patterns:
          - "xunit*"
          - "Moq"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "MockQueryable*"
          - "coverlet.*"
          - "Testcontainers*"
      # MassTransit ecosystem
      masstransit:
        patterns:
          - "MassTransit*"
    # Bỏ qua major version bumps cho các package critical.
    # Backend đang target net8.0, nên major upgrade (9.x/10.x) cần làm thủ công.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Moq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MockQueryable*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Testcontainers*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # GitHub Actions — update workflow actions hàng tuần.
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # ============================================================
  # Docker base images — update mỗi tuần.
  # Mỗi service Dockerfile có 1 directory riêng để dependabot scan.
  # ============================================================
  - package-ecosystem: "docker"
    directory: "/services/ApiGateway/src/ApiGateway"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/AuthService/src/AuthService.Api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/EmailService/src/EmailService.Api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/SmsService/src/SmsService.Api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/FileStorageService/src/FileStorageService.Api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]
