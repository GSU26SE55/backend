syntax = "proto3";

package grpc.health.v1;

// Minimal copy of the stable gRPC health-checking protocol used only by the
// production preflight. It avoids reflection and does not duplicate AI's
// application contract.
service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }

  ServingStatus status = 1;
}
