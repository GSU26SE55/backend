# =====================================================================
# RBAC cho Jenkins agent — cho phép helm deploy + kubectl apply.
# Apply 1 lần SAU khi cài Jenkins:
#   kubectl apply -f deploy/jenkins/rbac.yaml
# =====================================================================
---
# Service account jenkins-agent đã được Jenkins Helm chart tự tạo.
# Bind cluster-admin role cho nó (giới hạn lại nếu cần ít quyền hơn).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-deployer
rules:
# Helm cần đọc/ghi mọi resource — wildcards cho gọn.
# Production tốt nhất scope theo namespace solar-* + chỉ resource cần thiết.
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps", "batch", "policy", "autoscaling", "networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
# CRD cho monitoring stack (Prometheus, ServiceMonitor, PrometheusRule, Alertmanager)
- apiGroups: ["monitoring.coreos.com"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["*"]
# RBAC quyền để kube-prometheus-stack deploy ServiceAccount + Role + RoleBinding
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
# Admission webhook (cert-manager, kube-prometheus-stack)
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
# Cert-manager
- apiGroups: ["cert-manager.io"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-deployer
subjects:
- kind: ServiceAccount
  name: jenkins-agent
  namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io
