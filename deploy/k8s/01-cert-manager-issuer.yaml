# Apply SAU khi cài cert-manager.
# Install a reviewed, explicitly pinned cert-manager release first. Do not use
# an unpinned `latest` URL in production.
# Sau đó render placeholder, không apply trực tiếp file này:
#   sed "s/__ACME_EMAIL__/ops@example.com/g" deploy/k8s/01-cert-manager-issuer.yaml | kubectl apply -f -
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
