apiVersion: v2
name: solar-battery
description: Solar Battery Maintenance — 9 ASP.NET services, data infrastructure and complete observability stack
type: application

# Version chart — bump khi thay đổi template structure
version: 0.2.1

# Phiên bản app — hiển thị trong helm list, không liên quan image tag thực tế
appVersion: "1.0.0"

keywords:
  - microservice
  - aspnet
  - solar-battery

maintainers:
  - name: Solar Battery Team

# Subchart dependency — chạy `helm dependency update` trước lần helm install đầu tiên.
# Tạo file Chart.lock + tải tarball xuống charts/.
dependencies:
  # kube-prometheus-stack = prometheus + grafana + alertmanager + node-exporter + kube-state-metrics
  # → cover 5 service trong docker-compose.yml: prometheus, grafana, alertmanager, node-exporter, cadvisor (K8s built-in)
  - name: kube-prometheus-stack
    version: "65.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  # loki-stack = loki + promtail (log aggregation)
  # → cover 2 service: loki, promtail
  - name: loki-stack
    version: "2.10.2"
    repository: https://grafana.github.io/helm-charts
    condition: loki-stack.enabled

  # Postgres exporter (cover 1 service: postgres-exporter)
  - name: prometheus-postgres-exporter
    version: "6.6.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: postgres-exporter
    condition: postgres-exporter.enabled

  # Redis exporter (cover 1 service: redis-exporter)
  - name: prometheus-redis-exporter
    version: "6.7.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: redis-exporter
    condition: redis-exporter.enabled
