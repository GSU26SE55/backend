# =====================================================================
# values-staging.yaml — override cho môi trường STAGING trên VPS
# Dùng: helm upgrade solar . -f values.yaml -f values-staging.yaml -n solar-staging
# =====================================================================

global:
  namespace: solar-staging
  domain: capstonegsu26se55.mooo.com
  aspnetEnvironment: Staging
  tlsIssuer: letsencrypt-staging      # đổi sang letsencrypt-prod khi tin tưởng cert đúng

services:
  apigateway:
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  authservice:
    replicas: 1                        # single VPS — 2 replica không có lợi
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits:   { cpu: 1,    memory: 1Gi }
    autoscaling:
      enabled: false                   # HPA vô nghĩa trên single node

  emailservice:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  smsservice:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  filestorageservice:
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  batteryservice:
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits:   { cpu: 1,    memory: 1Gi }

postgres:
  storage: 10Gi

rabbitmq:
  storage: 5Gi
  ingress:
    enabled: true   # rabbitmq.capstonegsu26se55.mooo.com → Management UI

minio:
  storage: 20Gi
  ingress:
    enabled: true   # files.capstonegsu26se55.mooo.com → S3 API
                    # minio.capstonegsu26se55.mooo.com → Console

# Monitoring nhẹ — chỉ bật alertmanager-discord relay.
# kube-prometheus-stack và loki-stack tốn ~3-4GB RAM — tắt cho VPS 4GB.
# Bật sau khi stack chạy ổn và đã nâng cấp VPS.
monitoring:
  alertmanagerDiscord:
    enabled: false                     # bật khi Alertmanager đã chạy
  prometheusRules:
    enabled: false
  grafanaDashboards:
    enabled: false

kube-prometheus-stack:
  enabled: false                       # quá nặng cho VPS 4GB — bật khi upgrade
  grafana:
    adminPassword: "Admin@123"         # đồng bộ với GRAFANA_ADMIN_PASSWORD trong secret
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
      - grafana.capstonegsu26se55.mooo.com

loki-stack:
  enabled: false                       # quá nặng — bật sau

postgres-exporter:
  enabled: false

redis-exporter:
  enabled: false

# Quota an toàn cho VPS 4GB RAM (k3s system ~0.5GB, headroom còn ~3.5GB)
resourceQuota:
  enabled: true
  requestsCpu: "3"
  requestsMemory: "3Gi"
  limitsCpu: "6"
  limitsMemory: "6Gi"
  pvcs: "10"
