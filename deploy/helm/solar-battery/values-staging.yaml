# =====================================================================
# values-staging.yaml — override cho môi trường STAGING trên VPS
# Dùng: helm upgrade solar . -f values.yaml -f values-staging.yaml -n solar-staging
# =====================================================================

global:
  namespace: solar-staging
  domain: capstonegsu26se55.mooo.com
  aspnetEnvironment: Staging
  tlsIssuer: letsencrypt-prod

services:
  apigateway:
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  authservice:
    replicas: 1                        # single VPS — 2 replica không có lợi
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits:   { cpu: 1,    memory: 1Gi }
    autoscaling:
      enabled: false                   # HPA vô nghĩa trên single node

  emailservice:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  smsservice:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  filestorageservice:
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  batteryservice:
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  ticketservice:
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits:   { cpu: 1,    memory: 1Gi }

  notificationservice:
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 750m, memory: 768Mi }

  auditaggregatorservice:           # Sprint audit #AUDIT-13
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 750m, memory: 768Mi }

postgres:
  storage: 10Gi

rabbitmq:
  storage: 5Gi
  ingress:
    enabled: true   # rabbitmq.capstonegsu26se55.mooo.com → Management UI

minio:
  storage: 20Gi
  ingress:
    enabled: true   # files.capstonegsu26se55.mooo.com → S3 API (presigned URL cần host này)
  # GH-788 — KHÔNG mở console ra Internet, kể cả staging: staging dùng chung root credential và
  # chứa dữ liệu thật do team upload khi thử. Vào console bằng
  # `kubectl port-forward svc/minio 9001:9001`.
  consoleIngress:
    enabled: false

# Monitoring stack for VPS staging. Resource requests stay low so the stack
# can fit on the current single-node k3s VPS while preserving sane limits.
monitoring:
  prometheusRules:
    enabled: true
  grafanaDashboards:
    enabled: true
  cadvisor:
    enabled: true

kube-prometheus-stack:
  enabled: true
  defaultRules:
    create: true
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  prometheusOperator:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 256Mi }
  kube-state-metrics:
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits:   { cpu: 100m, memory: 128Mi }
  prometheus-node-exporter:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }
  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: 4GB
      scrapeInterval: 15s
      evaluationInterval: 15s
      resources:
        requests: { cpu: 75m, memory: 160Mi }
        limits:   { cpu: 500m, memory: 768Mi }
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
  alertmanager:
    alertmanagerSpec:
      secrets:
      - solar-secrets
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 128Mi }
  grafana:
    adminPassword: "Admin@123"
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits:   { cpu: 250m, memory: 384Mi }
    persistence:
      enabled: true
      size: 2Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
      - grafana.capstonegsu26se55.mooo.com
      path: /
      pathType: Prefix
      tls:
      - secretName: grafana-tls
        hosts:
        - grafana.capstonegsu26se55.mooo.com

loki-stack:
  enabled: true
  loki:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 300m, memory: 512Mi }
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  promtail:
    enabled: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

postgres-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

redis-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

# Quota an toàn cho VPS 4GB RAM (k3s system ~0.5GB, headroom còn ~3.5GB)
resourceQuota:
  enabled: true
  requestsCpu: "4"
  requestsMemory: "4Gi"
  limitsCpu: "10"
  limitsMemory: "12Gi"
  pvcs: "15"
