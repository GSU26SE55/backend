# =====================================================================
# Prometheus Alert Rules — Solar Battery Maintenance
# =====================================================================
# 10 alert rules quan trọng. Severity: critical (page oncall) | warning (slack).
# Mỗi rule có `for: <duration>` để tránh flapping (alert chỉ fire khi điều kiện
# kéo dài qua khoảng thời gian đó).
# =====================================================================

groups:
  # =====================================================================
  # Service availability & error rates
  # =====================================================================
  - name: service-health
    interval: 30s
    rules:
      # 1. Service down — Prometheus không scrape được /metrics qua 1 phút.
      - alert: ServiceDown
        expr: up{tier=~"backend|gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Prometheus failed to scrape {{ $labels.service }} for over 1 minute."

      # 2. High HTTP 5xx error rate — > 5% requests trả 5xx trong 5 phút.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_received_total{code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_received_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate on {{ $labels.service }} ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests are 5xx errors over the last 5 minutes."

      # 3. High HTTP latency — p95 > 1s trong 5 phút.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency on {{ $labels.service }} > 1s (currently {{ $value }}s)"
          description: "Request latency degraded — investigate downstream calls."

  # =====================================================================
  # Messaging & Reliability patterns (Outbox / Inbox / Idempotency-Key)
  # =====================================================================
  - name: messaging-reliability
    interval: 30s
    rules:
      # 4. Outbox backlog — > 100 messages chưa publish kéo dài 5 phút (RabbitMQ down hoặc relay job stuck).
      - alert: OutboxBacklog
        expr: outbox_messages_pending_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog > 100 messages"
          description: "{{ $value }} messages pending publish — RabbitMQ down or relay job stuck."

      # 5. Outbox publish failure spike — > 1 fail/sec (RabbitMQ likely down).
      - alert: OutboxPublishFailures
        expr: rate(outbox_messages_failures_total[5m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox publish failing at {{ $value }} msg/sec"
          description: "Reasons: {{ $labels.reason }}. Likely RabbitMQ outage — check broker status."

      # 6. Poison messages (RetryCount >= MaxRetries) — bất kỳ message nào bị skip → ngó ngay.
      - alert: OutboxPoisonMessages
        expr: increase(outbox_messages_skipped_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Outbox skipped {{ $value }} poison messages"
          description: "Messages reached MaxRetries — manual intervention required."

      # 7. High Inbox duplicate rate — > 50% messages bị skip (consumer retry quá nhiều, có thể bug ack).
      - alert: HighInboxDuplicateRate
        expr: |
          (
            sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer)
            /
            (sum(rate(inbox_messages_processed_total[5m])) by (consumer)
             + sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer {{ $labels.consumer }} duplicate rate > 50%"
          description: "Consumer is retrying too often — check ack logic or downstream errors."

      # 8. Idempotency-Key conflicts spike — client retry parallel quá nhiều (UX issue).
      - alert: IdempotencyConflictSpike
        expr: rate(idempotency_key_conflicts_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Idempotency conflicts at {{ $value }}/sec"
          description: "Client may be sending parallel duplicate requests with same key."

  # =====================================================================
  # Alert–Ticket Saga (Sprint 5B #239 — overall.md §9.2)
  # =====================================================================
  - name: alert-ticket-saga
    interval: 30s
    rules:
      # 11. Saga failure rate spike — > 5 failures trong 5 phút (SEV2 page).
      # NotificationService AlertTicketSagaFailedConsumer cũng fire email/push parallel.
      - alert: SagaFailedRateSpike
        expr: increase(saga_alert_ticket_failed_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alert-Ticket Saga failures {{ $value }} in 5m"
          description: "Reason: {{ $labels.reason }}. Runbook: docs/runbooks/08-saga-failed.md"

      # 12. Saga stuck — > 50 in-flight sagas (TicketRequested/AlertLinkRequested) > 15 phút.
      # Khả năng: Quartz timer mất hoặc consumer DI crash giữa pipeline.
      - alert: SagaStuck
        expr: saga_alert_ticket_active_count > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Saga active count {{ $value }} over 15min"
          description: "Quartz timer drift hoặc consumer crash. Runbook: docs/runbooks/09-saga-stuck.md"

  # =====================================================================
  # Sprint 7 #118 — Environmental monitoring (smoke/water/over-temp incident)
  # Metrics emit từ BatteryService.Infrastructure.Observability.EnvironmentalMetrics:
  #   environmental_incident_detected_total{type, severity}           (counter)
  #   environmental_incident_detection_latency_seconds{...}_bucket    (histogram — lag DetectedAt → ghi nhận)
  # =====================================================================
  - name: environmental-monitoring
    interval: 30s
    rules:
      # Incident Critical (smoke/water) detect → page NGAY (an toàn). Latency phát hiện phải thấp.
      - alert: EnvironmentalIncidentCriticalDetected
        expr: increase(environmental_incident_detected_total{severity="Critical"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Critical environmental incident detected ({{ $labels.type }})"
          description: "{{ $value }} sự cố môi trường Critical (type={{ $labels.type }}) trong 5m. Page Manager + Admin ngay."

      # Detection latency cao — p95 lag từ lúc incident xảy ra đến lúc hệ thống ghi nhận > 5 phút.
      - alert: EnvironmentalIncidentDetectionLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(environmental_incident_detection_latency_seconds_bucket[15m])) by (le)
          ) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Environmental incident detection latency p95 {{ $value }}s"
          description: "Phát hiện sự cố môi trường chậm (p95 > 5 phút). Kiểm tra pipeline report/ingest ambient."

  # =====================================================================
  # Sprint IoT-2 — IoT edge device fleet (§52.12 metric schema)
  # Metrics emit từ BatteryService.Infrastructure.Observability.IotMetrics:
  #   iot_device_heartbeats_total{device_id, status}      (counter, status=ok|clock_drift)
  #   iot_devices_online_count                            (gauge — refresher 30s)
  #   iot_devices_offline_total                           (counter)
  #   iot_sensor_readings_ingested_total{device_id}       (counter)
  #   iot_sensor_readings_rejected_total{reason}          (counter; reason=clock_drift|sensor_outlier|mapping_invalid|idempotency_replay|scope_denied)
  #   iot_firmware_updates_total{from_version, to_version, status}
  #   iot_devices_auto_decommissioned_total{device_id}    (counter — outlier auto-disable)
  #   iot_cross_source_mismatch_alerts_total              (counter — BMS vs IoT mismatch)
  # =====================================================================
  - name: iot-device-fleet
    interval: 30s
    rules:
      # 13. IoT device offline spike — > 3 device chuyển sang Offline trong 5 phút.
      # Có thể: WiFi outage tại 1 site, broker MQTT down, NTP server lost,
      # firmware mới gây crash, hoặc backend overload từ chối heartbeat.
      - alert: IotDeviceOfflineSpike
        expr: increase(iot_devices_offline_total[5m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} IoT device(s) chuyển sang Offline trong 5 phút"
          description: "Kiểm tra: WiFi/network tại site, MQTT broker status, batteryservice heartbeat handler."

      # 14. IoT heartbeat ingestion stall — không nhận heartbeat nào > 5 phút khi fleet active.
      # Tránh fire khi chưa deploy device (predicate `iot_devices_online_count > 0`).
      - alert: IotHeartbeatStall
        expr: |
          rate(iot_device_heartbeats_total[5m]) == 0
          and on() iot_devices_online_count > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Không nhận heartbeat IoT > 5 phút (fleet đang online {{ $value }} device)"
          description: "Có thể: gateway down, route /api/iot-devices/heartbeat lỗi, hoặc fleet mất kết nối toàn bộ."

      # 15. Sensor outlier reject rate spike — > 10% reading bị loại trong 10 phút.
      # Khả năng: BMS lỗi sensor, calibration sai (Scale/Offset), noise hardware nặng.
      - alert: IotSensorOutlierSpike
        expr: |
          (
            sum(rate(iot_sensor_readings_rejected_total{reason="sensor_outlier"}[10m]))
            /
            (sum(rate(iot_sensor_readings_ingested_total[10m]))
             + sum(rate(iot_sensor_readings_rejected_total{reason="sensor_outlier"}[10m])))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outlier reject rate {{ $value | humanizePercentage }} > 10%"
          description: "Kiểm tra calibration profile (iot_device_calibrations) hoặc raw BMS reading."

      # 16. Clock drift fleet-wide — > 50% heartbeat có status=clock_drift trong 15 phút.
      # NTP outage thường gây drift đồng loạt cả fleet.
      - alert: IotClockDriftFleetWide
        expr: |
          (
            sum(rate(iot_device_heartbeats_total{status="clock_drift"}[15m]))
            /
            sum(rate(iot_device_heartbeats_total[15m]))
          ) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} heartbeat bị clock drift > 5 phút"
          description: "Kiểm tra NTP server (time.google.com) — drift đồng loạt thường do NTP outage."

      # 17. Firmware update failure rate — > 30% attempt trả failed/rolled_back trong 1 giờ.
      # Bản firmware mới có thể có bug.
      - alert: IotFirmwareUpdateFailureSpike
        expr: |
          (
            sum(increase(iot_firmware_updates_total{status=~"failed|rolledback"}[1h]))
            /
            sum(increase(iot_firmware_updates_total[1h]))
          ) > 0.3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Firmware update fail rate {{ $value | humanizePercentage }} trong 1h"
          description: "Cân nhắc archive bản qua POST /api/admin/iot-firmware-releases/{id}/archive."

      # 18. Sprint IoT-2 #IoT2-17 — auto-decommission spike (>50 outlier/h → disable device).
      # Indicator: device đang hỏng phần cứng hoặc bị tamper.
      - alert: IotDeviceAutoDecommissionedSpike
        expr: increase(iot_devices_auto_decommissioned_total[1h]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} device(s) tự decommission do outlier vượt ngưỡng 50/h"
          description: "Device sensor có thể hỏng. Kiểm tra IotDevice.AutoDecommissionedAt + last calibration."

      # 19. Sprint IoT-2 #IoT2-28 — cross-source mismatch (BMS vs IoT lệch).
      # Burst > 5 alert/h gợi ý 1 trong 2 nguồn đang sai (sensor lệch hoặc calibration drift).
      - alert: IotCrossSourceMismatchBurst
        expr: increase(iot_cross_source_mismatch_alerts_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} SensorMismatch alert trong 1h"
          description: "Kiểm tra calibration BMS hoặc IoT sensor — 2 nguồn có thể đã drift quá ngưỡng (V>0.5V hoặc T>5°C)."

      # 20. Sprint IoT-2 #IoT2-18 — mapping permission violations.
      # Spike → có khả năng key bị compromise và dùng cho site khác.
      - alert: IotIngestMappingDenied
        expr: increase(iot_sensor_readings_rejected_total{reason="mapping_invalid"}[5m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} reading bị reject do device không quyền cho asset/site"
          description: "Có thể API key bị tái sử dụng sai site hoặc serial config sai. Audit IotDevice.SiteId vs BatteryAsset.SiteId."

  # =====================================================================
  # Sprint IoT-2 — MQTT bridge alerts (CLIENT, broker thuộc iot repo)
  # Chỉ fire khi Mqtt__Enabled=true. Bridge tự log + idle nếu disabled.
  # Note: broker `up{component="mosquitto"}` alert KHÔNG ở đây vì broker
  # do iot repo own — alert đó nằm trong iot Helm chart.
  # =====================================================================
  - name: iot-mqtt-bridge
    interval: 30s
    rules:
      # 21. MQTT bridge log "connected to broker, 4 subscriptions" không xuất hiện > 5min sau startup
      # → bridge không connect được (broker down / cred sai / cert hết hạn).
      # NOTE: cần expose `mqtt_bridge_connected` gauge từ code — Sprint sau implement.
      - alert: MqttBridgeDisconnected
        expr: mqtt_bridge_connected == 0 and on() mqtt_bridge_enabled == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MQTT bridge mất kết nối tới broker > 2 phút"
          description: "Kiểm tra: Mqtt__Host reachable, Mqtt__Password, cert TLS (production), ACL config. Bridge tự reconnect mỗi Mqtt__ReconnectIntervalSeconds (default 5s)."

  # =====================================================================
  # Sprint BE-IoT-Realtime — SSE telemetry live stream (overall.md §34.10)
  # Metric do RealtimeMetrics.cs phát: `sse_active_connections{scope}`,
  # `sse_events_pushed_total{scope,event}`. Trước 2026-08-01 hai metric này ĐÃ CÓ trong code
  # nhưng KHÔNG rule/dashboard nào đọc — tức là stream chết cũng không ai biết.
  # =====================================================================
  - name: sse-realtime
    interval: 30s
    rules:
      # 22. Có client đang mở stream nhưng KHÔNG event nào được đẩy trong 5 phút.
      # Nghĩa là ingest ngừng, Redis pub/sub đứt, hoặc Realtime:Enabled bị tắt nhầm.
      # Người dùng thấy biểu đồ đứng hình mà không có lỗi nào — đúng kiểu hỏng im lặng.
      # `ping` bị loại khỏi phép đếm: heartbeat vẫn chạy kể cả khi không còn dữ liệu thật,
      # tính vào là alert sẽ không bao giờ fire.
      - alert: SseStreamStalled
        expr: |
          sum(sse_active_connections) > 0
          and
          sum(rate(sse_events_pushed_total{event!="ping"}[5m])) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SSE có {{ $value }} kết nối nhưng không đẩy event nào > 5 phút"
          description: >-
            Kiểm tra theo thứ tự: (1) cờ Realtime:Enabled còn true?
            (2) ingest /api/sensor-readings/batch còn nhận dữ liệu?
            (3) Redis pub/sub còn sống? Client vẫn nhận `ping` nên kết nối KHÔNG rớt —
            chỉ là không có số liệu.

      # 23. Số kết nối SSE tăng bất thường — mỗi kết nối giữ 1 subscription Redis + 1 channel
      # trong tiến trình, nên rò kết nối (client không đóng, reverse proxy giữ) sẽ ăn dần bộ nhớ.
      # Ngưỡng 200 chọn theo quy mô capstone; chỉnh khi số người dùng thật tăng.
      - alert: SseConnectionsHigh
        expr: sum(sse_active_connections) > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSE đang giữ {{ $value }} kết nối đồng thời"
          description: >-
            Nghi rò kết nối hoặc client reconnect liên tục. Mỗi kết nối = 1 subscription Redis
            + 1 channel in-process. Kiểm tra log reconnect và cấu hình timeout ở reverse proxy.

  # =====================================================================
  # Infrastructure
  # =====================================================================
  - name: infrastructure
    interval: 30s
    rules:
      # 9. Container memory usage > 90% limit — sắp OOM.
      - alert: ContainerMemoryHigh
        expr: |
          (container_memory_working_set_bytes{name!=""}
           / container_spec_memory_limit_bytes{name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 90%"
          description: "Container approaching OOM — consider raising limits or investigating leak."

      # 10. Postgres connections high — > 80% of max_connections.
      - alert: PostgresConnectionsHigh
        expr: |
          (sum(pg_stat_activity_count) by (instance)
           / sum(pg_settings_max_connections) by (instance)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections at {{ $value | humanizePercentage }} of limit"
          description: "Connection pool exhaustion risk — check for connection leaks."

  # =====================================================================
  # Sprint additional-auth #AUTH-78 — Auth-domain security alerts
  # =====================================================================
  - name: auth-security
    interval: 30s
    rules:
      # 11. Login brute force — > 20 invalid_credentials/min trong 5 phút.
      # Phát hiện credential stuffing / brute force / leaked password list attack.
      - alert: AuthLoginBruteForce
        expr: sum(rate(auth_login_total{result="invalid_credentials"}[5m])) > (20/60)
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: "Login brute force suspected ({{ $value | humanize }} req/s invalid creds)"
          description: "Invalid credentials rate >20/min sustained 5 phút. Check rate-limit middleware effectiveness + IP source distribution. Có thể cần block IP gateway-level."

      # 12. Refresh token reuse detected — security incident, cần điều tra ngay.
      # AUTH-28 + AUTH-79: khi family bị revoke do reuse, log ra metric này.
      - alert: AuthRefreshTokenReuseDetected
        expr: sum(increase(auth_refresh_token_total{result="reuse_detected"}[10m])) > 0
        for: 0m  # fire ngay lập tức — không wait
        labels:
          severity: critical
          domain: auth
        annotations:
          summary: "Refresh token reuse detected — possible token theft"
          description: "Token chain bị reuse → attacker stole refresh token HOẶC race condition trong client. Check audit_logs cho AccountId bị affect + invalidate all sessions của user đó."

      # 13. 2FA failure rate spike — > 10 wrong 2FA codes/min trong 5 phút.
      # Có thể TOTP clock drift hoặc brute force backup code.
      - alert: Auth2FAFailureSpike
        expr: sum(rate(auth_2fa_challenge_total{result=~"invalid_code|wrong"}[5m])) > (10/60)
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: "2FA failure rate spike ({{ $value | humanize }} fail/s)"
          description: "Wrong 2FA code rate cao bất thường. Check: TOTP server clock drift, backup code brute force, hoặc UI bug khiến user nhập sai."

      # 14. OTP wrong rate spike — > 30/min trong 5 phút.
      # Brute force OTP registration/reset/email-change/phone-verify.
      - alert: AuthOtpBruteForce
        expr: sum(rate(auth_otp_usage_total{result="wrong"}[5m])) by (otp_purpose) > (30/60)
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: "OTP brute force on {{ $labels.otp_purpose }} ({{ $value | humanize }} wrong/s)"
          description: "Wrong OTP rate cho purpose={{ $labels.otp_purpose }} cao. Check per-account lockout (5/15min) đang work + per-email rate limit (AUTH-13 otp_attempts:fp:)."

      # 15. Login success drop — anomaly detection: tỷ lệ login thành công sụt < 50% sustained 10 phút.
      # Có thể DB down, password hash service issue, hoặc 2FA service degraded.
      # AUTH-48: success_trusted_device là login pass-through (skip 2FA challenge nhờ trust device match)
      # → cũng count là success cho tỷ lệ tổng thể.
      - alert: AuthLoginSuccessRateLow
        expr: |
          (
            sum(rate(auth_login_total{result=~"success|success_2fa|success_trusted_device"}[10m]))
            /
            sum(rate(auth_login_total[10m]))
          ) < 0.5 and sum(rate(auth_login_total[10m])) > (5/60)
        for: 10m
        labels:
          severity: critical
          domain: auth
        annotations:
          summary: "Login success rate < 50% ({{ $value | humanizePercentage }})"
          description: "Phần lớn login attempts đang fail. Check: DB connection, password verify performance (BCrypt cost), 2FA challenge store (Redis), suspicious mass-login pattern."

      # 16. AUTH-48: Trusted device usage spike — sudden surge có thể indicate compromised trust device list.
      # Baseline: trusted device login ~ 10-30% sau adoption stable. > 80% spike trong 10m sustained
      # = bất thường: hoặc 2FA service degraded (user fall back to trusted device flow), hoặc trust list bị abuse.
      - alert: AuthTrustedDeviceUsageSpike
        expr: |
          (
            sum(rate(auth_login_total{result="success_trusted_device"}[10m]))
            /
            sum(rate(auth_login_total{result=~"success|success_2fa|success_trusted_device"}[10m]))
          ) > 0.8 and sum(rate(auth_login_total{result="success_trusted_device"}[10m])) > (5/60)
        for: 10m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: "Trusted device login share > 80% ({{ $value | humanizePercentage }})"
          description: "Tỷ lệ login qua trusted device cao bất thường. Check: 2FA service health (degraded → user pass-through via trust device), trust list integrity (compromised → mass abuse), hoặc UI changes (recently enabled trust opt-in)."

  # =====================================================================
  # Sprint audit #AUDIT-44 — Hybrid Audit pipeline
  # =====================================================================
  - name: audit-pipeline
    interval: 30s
    rules:
      # 11. Audit outbox backlog — > 1000 entry Pending mỗi service trong 5 phút (relay stuck / RabbitMQ down).
      - alert: AuditOutboxBacklog
        expr: audit_outbox_pending_total > 1000
        for: 5m
        labels:
          severity: warning
          domain: audit
        annotations:
          summary: "Audit outbox backlog on {{ $labels.service }} ({{ $value }} pending)"
          description: "audit_outbox_pending_total > 1000 trong 5 phút. Check: relay running? RabbitMQ healthy? Redis leader key. Runbook: docs/audit/operations-runbook.md."

      # 12. Audit consumer lag — p99 ingest lag > 30s trong 5 phút (aggregator quá tải / DB chậm).
      - alert: AuditConsumerLag
        expr: histogram_quantile(0.99, sum(rate(audit_consumer_lag_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
          domain: audit
        annotations:
          summary: "Audit consumer lag p99 > 30s ({{ $value | humanize }}s)"
          description: "Aggregator ingest lag p99 vượt 30s (SLO < 10s). Scale aggregator pod / check audit_aggregate index."

      # 13. Audit DLQ growing — > 100 message trong dead-letter queue (poison event / schema mismatch).
      - alert: AuditDlqGrowing
        expr: audit_dlq_size_total > 100
        for: 5m
        labels:
          severity: critical
          domain: audit
        annotations:
          summary: "Audit DLQ growing ({{ $value }} messages)"
          description: "aggregator.audit.events.dlq > 100. Inspect poison message, fix consumer, shovel DLQ → main queue. Runbook: docs/audit/operations-runbook.md."


  # ===================================================================
  # Chat Hub Alerts (#572)
  # ===================================================================
  - name: chat_hub_alerts
    # Đặt tường minh cho khớp 9 nhóm còn lại. Bỏ trống thì nhóm chạy theo
    # `global.evaluation_interval` — 15s ở docker-compose nhưng do kube-prometheus-stack
    # quyết định trên K8s, tức cùng một rule lại nổ theo hai nhịp khác nhau tuỳ môi trường.
    interval: 30s
    rules:
      # 1. Chat outbox backlog > 500 for 5m
      - alert: ChatOutboxBacklog
        expr: chat_outbox_pending_total > 500
        for: 5m
        labels:
          severity: warning
          domain: chat
        annotations:
          summary: "Chat outbox backlog > 500 ({{ $value }})"
          description: "Chat outbox messages are accumulating — check RabbitMQ connectivity and OutboxRelayBackgroundService."

      # 2. SignalR disconnect storm: > 100 disconnects/min
      - alert: SignalRDisconnectStorm
        expr: sum(delta(signalr_connected_users_total[1m])) < -100
        for: 1m
        labels:
          severity: critical
          domain: chat
        annotations:
          summary: "SignalR disconnect storm detected"
          description: "More than 100 SignalR disconnects per minute — possible hub restart or network issue."

      # 3. Chat rate limit hits > 1000/hour
      - alert: ChatRateLimitHit
        expr: sum(rate(chat_events_total{event_type="rate_limit"}[1h])) * 3600 > 1000
        for: 5m
        labels:
          severity: warning
          domain: chat
        annotations:
          summary: "Chat rate limit hit > 1000/hour"
          description: "High rate-limit trigger count suggests abuse or misconfigured client. Check spam filter."

  # ══════════════════════════════════════════════════════════════════════
  # Sprint 6.3 NOTI3-07 (#707) — Notification delivery
  # Sprint 6.2 bật tầng gửi (Push/Email/SMS) nhưng trước đó không có metric nào
  # ⇒ hỏng mà không ai biết. Nhóm alert dưới đây là điều kiện tối thiểu để
  # "vận hành được" chứ không chỉ "chạy được".
  # ══════════════════════════════════════════════════════════════════════
  - name: notification-delivery
    interval: 30s
    rules:
      # 1. Tỷ lệ gửi thất bại > 5% trong 5 phút, tách theo channel.
      #    Tách channel vì mỗi kênh có kiểu hỏng riêng: Expo throttle, Mailjet
      #    reject, gateway SMS mất heartbeat — gộp lại sẽ che mất kênh đang chết.
      - alert: NotificationFailureRateHigh
        expr: |
          sum by (channel) (rate(notification_failed_total[5m]))
          /
          clamp_min(
            sum by (channel) (rate(notification_sent_total[5m]))
            + sum by (channel) (rate(notification_failed_total[5m])),
            0.001
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          domain: notification
        annotations:
          summary: "Notification failure rate > 5% trên channel {{ $labels.channel }}"
          description: "Tỷ lệ gửi thất bại {{ $value | humanizePercentage }}. Kiểm tra provider của channel này (Expo / Mailjet / SMS gateway) và bảng notifications cột failure_reason."

      # 2. DLQ phải luôn = 0. Có message nghĩa là consumer chết hẳn sau khi retry.
      - alert: NotificationDlqNotEmpty
        expr: sum(notification_dlq_size) > 0
        for: 1m
        labels:
          severity: critical
          domain: notification
        annotations:
          summary: "Notification DLQ có {{ $value }} message"
          description: "Trạng thái khoẻ mạnh của DLQ là 0. Message ở đây là việc đã thất bại vĩnh viễn — xem queue _error trên RabbitMQ."

      # 3. Queue lag: tồn đọng cao kéo dài.
      #    Ngưỡng đặt theo trần throughput đã ghi nhận ở NOTI3-10 (~20 noti/s,
      #    leader-election 1 instance). 1000 record tồn ≈ 50s xử lý — nếu giữ
      #    mức này 10 phút nghĩa là tốc độ sinh đã vượt tốc độ giao.
      - alert: NotificationQueueBacklog
        expr: notification_pending_total > 1000
        for: 10m
        labels:
          severity: warning
          domain: notification
        annotations:
          summary: "Notification tồn đọng {{ $value }} record"
          description: "Vượt trần throughput của dispatch worker 1-instance. Đây là tín hiệu đã hẹn trước ở NOTI3-10 để cân nhắc chuyển sang partition theo channel."

      # 4. Dispatch worker đứng im: không gửi được gì suốt 15' trong khi vẫn có hàng chờ.
      #    Bắt được cả trường hợp worker chết lẫn leader-election kẹt.
      - alert: NotificationDispatchStalled
        expr: |
          sum(rate(notification_sent_total[15m])) == 0
          and notification_pending_total > 0
        for: 15m
        labels:
          severity: critical
          domain: notification
        annotations:
          summary: "Dispatch worker không gửi được gì trong 15 phút dù còn {{ $value }} record chờ"
          description: "Kiểm tra NotificationDispatchBackgroundService còn sống không, Redis leader key notification_dispatch_leader có bị instance chết giữ không, và cờ Notification:Dispatch:Enabled."

      # 5. Token Expo chết hàng loạt — thường do sai credential hoặc cấu hình project.
      - alert: ExpoTokenDeactivationSpike
        expr: sum(rate(expo_push_token_deactivated_total[1h])) * 3600 > 50
        for: 10m
        labels:
          severity: warning
          domain: notification
        annotations:
          summary: "{{ $value }} device token bị vô hiệu hoá trong 1 giờ"
          description: "Bình thường token chỉ chết rải rác khi user gỡ app. Tăng đột biến thường do sai EAS projectId hoặc credential FCM/APNs hết hạn."
