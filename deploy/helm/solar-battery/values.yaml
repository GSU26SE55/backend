# =====================================================================
# values.yaml — Default config (dev profile, dùng làm baseline)
# Override bằng values-staging.yaml hoặc values-prod.yaml.
# =====================================================================

# --------------------------------------------------------------------
# Global config — apply cho tất cả service
# --------------------------------------------------------------------
global:
  # Image registry. Jenkins push image với tag = git SHA về đây.
  # Deliberately not named `global.imageRegistry`: common subcharts consume that
  # reserved key and would incorrectly rewrite every Prometheus/Grafana image
  # into the private application registry.
  appImageRegistry: ghcr.io/gsu26se55

  # Tag mặc định. Jenkins override `--set global.imageTag=abc1234` lúc deploy.
  imageTag: latest

  # Always khi tag là floating (latest, main, staging, dev) — đảm bảo pull image mới nhất.
  # IfNotPresent khi tag là git SHA / semver pinned → tận dụng cache.
  # Jenkins luôn deploy với SHA → IfNotPresent là đủ. Nhưng manual deploy với :latest
  # cần Always để không bị stuck cache. Trade-off: chọn Always cho an toàn.
  imagePullPolicy: Always

  # Namespace mặc định. Jenkins set `-n solar-staging` lúc helm upgrade.
  namespace: solar-dev

  # Domain public dùng cho Ingress của ApiGateway.
  # Jenkins/staging dùng `staging.example.com`, prod dùng `api.example.com`.
  domain: capstonegsu26se55.mooo.com

  # Public browser origin. Empty means https://{global.domain}. Production sets
  # this explicitly so email links, OAuth and CORS cannot drift apart.
  frontendOrigin: ""

  # ASP.NET environment — Development / Staging / Production
  # ⚠️ Đặt `Production` thì CORS whitelist trở thành BẮT BUỘC (#AUTH-05): thiếu
  # `Cors__AllowedOrigins__0` là mọi pod CrashLoopBackOff. Chart tự sinh origin từ `domain`
  # ở trên nên mặc định đã có 1 origin — chỉ cần thêm origin phụ vào `extraCorsOrigins`.
  aspnetEnvironment: Development

  # #AUTH-05 — origin PHỤ được phép gọi API (ngoài "https://{domain}" chart tự thêm).
  # Dùng cho: cổng dev của FE, domain quản trị riêng, WebView mobile có origin riêng…
  # Origin = scheme + host (+ port nếu khác 443/80). KHÔNG kèm path, KHÔNG kèm '/' cuối.
  # Ví dụ:
  #   extraCorsOrigins:
  #     - "https://admin.capstonegsu26se55.mooo.com"
  #     - "http://localhost:5173"
  extraCorsOrigins: []

  # cert-manager ClusterIssuer — staging dùng letsencrypt-staging (rate limit cao),
  # production dùng letsencrypt-prod.
  tlsIssuer: letsencrypt-staging

  # ghcr.io credentials secret — phải tạo trước khi helm install:
  #   kubectl create secret docker-registry ghcr-pull \
  #     --namespace solar-staging \
  #     --docker-server=ghcr.io --docker-username=USER --docker-password=PAT
  imagePullSecret: ghcr-pull

  # Default rolling update keeps zero downtime on larger nodes.
  # VPS-small overlay changes this to avoid temporary double memory usage.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

  # Sprint 7 #116 — OTLP endpoint cho OpenTelemetry tracing. Để trống = tracing tắt.
  # Tự override thành http://tempo:4317 khi tempo.enabled (xem shared/configmap.yaml).
  otlpEndpoint: ""

# Encrypted point-to-point network between the platform VPS and the AI VPS.
# Production enables this and injects the two host-owned /32 addresses from
# /opt/solar-platform/config/host.env. Keeping it disabled by default preserves
# local/staging behavior where wg0 does not exist.
wireguard:
  enabled: false
  platformIpv4: ""
  aiIpv4: ""

# --------------------------------------------------------------------
# ASP.NET services
# --------------------------------------------------------------------
services:
  apigateway:
    enabled: true
    image: apigateway          # image tên `ghcr.io/.../apigateway:<tag>`
    digest: ""                 # production Jenkins override bằng sha256:...
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    # Chỉ apigateway expose ra public qua Ingress
    ingress:
      enabled: true
      path: /
    # Auto-scale theo CPU (chỉ kích hoạt khi replicas >= 2)
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  authservice:
    enabled: true
    image: authservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    # GH-295 — DataProtection keys PVC (2FA secret encryption). Mất volume = mất
    # khả năng decrypt mọi TwoFactorSecret trong DB. Backup cùng postgres-data.
    dataProtectionKeys:
      storage: 128Mi
      # storageClass: longhorn   # override per env (vd longhorn / gp3 / standard)

  emailservice:
    enabled: true
    image: emailservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 50m,  memory: 128Mi }
      limits:   { cpu: 300m, memory: 256Mi }

  smsservice:
    enabled: true
    image: smsservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 50m,  memory: 128Mi }
      limits:   { cpu: 300m, memory: 256Mi }

  filestorageservice:
    enabled: true
    image: filestorageservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  batteryservice:
    enabled: true
    image: batteryservice
    digest: ""
    replicas: 1
    port: 8080
    grpcPort: 8081
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 750m, memory: 768Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    # Sprint IoT-2 #IoT2-35 — PVC cho firmware .bin upload (multipart endpoint).
    # Disable + dùng object storage (S3/MinIO) khi production scale > 1 replica
    # (PVC ReadWriteOnce không share giữa replicas).
    firmwareStorage:
      enabled: true
      mountPath: /data/firmware-storage
      size: 2Gi
      storageClass: ""           # "" = cluster default; set local-path/longhorn/... nếu cần
      accessMode: ReadWriteOnce

  ticketservice:
    enabled: true
    image: ticketservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 750m, memory: 768Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  notificationservice:
    enabled: true
    image: notificationservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  # Sprint audit #AUDIT-13 — read-store hợp nhất audit (consume AuditCreatedEventV1, REST Audit Explorer admin).
  auditaggregatorservice:
    enabled: true
    image: auditaggregatorservice
    digest: ""
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

# --------------------------------------------------------------------
# Infrastructure (chạy trong cluster — production tốt nhất dùng managed Postgres/Redis)
# --------------------------------------------------------------------
postgres:
  enabled: true
  image: timescale/timescaledb:latest-pg16
  clientImage: postgres:16-alpine
  database: auth_db
  fileStorageDatabase: file_storage_db
  batteryDatabase: battery_db
  ticketDatabase: ticket_db
  notificationDatabase: notification_db
  smsDatabase: sms_db
  auditAggregatorDatabase: audit_aggregate_db   # Sprint audit #AUDIT-13/14 — read-store audit_aggregate
  username: postgres
  storage: 5Gi
  # Tăng max_connections để hỗ trợ pool nhiều service × replica.
  # Công thức: max_connections >= sum(replicas × poolSize) + buffer
  maxConnections: 300
  sharedBuffers: 128MB
  connectionPool:
    maximumPoolSize: 25
    minimumPoolSize: 2
  initJob:
    activeDeadlineSeconds: 180
    ttlSecondsAfterFinished: 300
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }
  backup:
    schedule: "0 */6 * * *"
    bucket: postgres-backups
    retentionDays: 14
    activeDeadlineSeconds: 1800
    lockWaitTimeout: 60s
    databaseTimeoutSeconds: 600
    maxAttempts: 3
    retryDelaySeconds: 15
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

redis:
  enabled: true
  image: redis:7-alpine
  appendOnly: true
  storage: 2Gi
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }

rabbitmq:
  enabled: true
  image: rabbitmq:3-management-alpine
  username: guest
  virtualHost: "/"
  storage: 2Gi
  returnPerObjectMetrics: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  ingress:
    enabled: false   # bật trong values-staging.yaml — expose rabbitmq.{domain}

minio:
  enabled: true
  image: minio/minio:latest
  clientImage: minio/mc:latest
  # GH-788 — root user/password đều lấy từ Secret `solar-secrets`
  # (ObjectStorage__AccessKey / ObjectStorage__SecretKey). values.yaml nằm trong Git nên không
  # chứa credential; khoá `rootUser` cũ đã bỏ để không ai vô tình đặt lại giá trị mặc định.
  bucketName: solar-battery-files
  storage: 10Gi
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  initJob:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }
  ingress:
    enabled: false   # bật trong values-staging.yaml — expose files.{domain} (S3 API) cho client
  # GH-788 — console quản trị TÁCH khỏi cờ trên và mặc định tắt ở MỌI môi trường.
  # Console đăng nhập bằng chính root credential ⇒ mở ra Internet là mở toàn quyền mọi bucket.
  # Cần vào console: `kubectl port-forward svc/minio 9001:9001`.
  consoleIngress:
    enabled: false
  serviceMonitor:
    # The MinIO cluster metrics endpoint requires a bearer token when public
    # authentication is disabled. Keep this off unless bearerTokenSecret is set.
    enabled: false
    bearerTokenSecret:
      name: ""
      key: ""

# --------------------------------------------------------------------
# Non-secret config — chuyển vào ConfigMap (mọi service envFrom)
# Tương đương các biến không nhạy cảm trong .env.Docker
# --------------------------------------------------------------------
config:
  Logging__LogLevel__Default: Information
  Logging__LogLevel__Microsoft.AspNetCore: Warning
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__SingleLine: "true"
  Logging__Console__FormatterOptions__IncludeScopes: "true"
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffZ"
  Logging__Console__FormatterOptions__UseUtcTimestamp: "true"

  # Tên service trong Docker network = host. K8s tương tự — Service name resolve qua CoreDNS.
  ConnectionStrings__Redis: "redis:6379"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: guest
  RabbitMQ__VirtualHost: "/"

  # ---------- Sprint BE-IoT-Realtime — SSE telemetry (overall.md §34.10) ----------
  Realtime__Enabled: "true"
  Realtime__HeartbeatSeconds: "30"
  Realtime__SummaryIntervalSeconds: "4"
  # #614 — phát bù khi client reconnect kèm header Last-Event-ID.
  # CHỈ áp cho scope 1 pin (event `reading`); summary/stats/ping không phát bù.
  # Bộ đệm là Redis Stream key `telemetry:replay:asset:{id}` — dùng CHUNG Redis với cache/backplane,
  # nên nhân N pin đang phát số liệu là N key. 200 bản ghi/pin ≈ vài phút dữ liệu.
  # ReplayMaxEvents=0 => TẮT phát bù (không sinh dòng `id:`). ReplayTtlMinutes=0 => không đặt hạn sống
  # (⚠️ để 0 thì key của pin đã ngừng gửi sẽ nằm lại Redis vĩnh viễn).
  Realtime__ReplayMaxEvents: "200"
  Realtime__ReplayTtlMinutes: "5"

  # ---------- ADR-0019 — đường vận chuyển push (SignalR ∥ Expo) ----------
  # Kênh Push có hai đường: hub SignalR tự vận hành và Expo Push API.
  #
  # ⚠️ Giá trị dưới CHỈ được đọc khi bảng `notification_settings` còn TRỐNG, tức lần đầu dựng một
  # môi trường mới. Sau khi Admin gọi PUT /api/admin/notification-settings/push-transport một lần
  # thì database là nguồn sự thật vĩnh viễn — `helm upgrade` KHÔNG ghi đè lựa chọn đó (cố ý).
  # Muốn ép lại thì xoá dòng `push.transport` trong bảng, hoặc gọi lại endpoint.
  #
  # SignalR — không cần khoá EAS/FCM, không cần device token, nhưng KHÔNG có bằng chứng giao hàng
  #           ⇒ trạng thái Delivered không bao giờ đạt tới và chuỗi bù SMS cho push critical tự nghỉ.
  # Expo    — cần device token còn hạn; có đối soát biên nhận nên mới có Delivered.
  # Both    — gửi cả hai, thành công khi ít nhất một đường thành công.
  Notification__Push__DefaultTransport: "SignalR"
  # Bao lâu thì lựa chọn của Admin lan tới worker nền và các pod khác (giây).
  Notification__Push__CacheSeconds: "30"

  # Hai worker phụ thuộc Expo (ExpoReceiptReconcile, NotificationFallback) tự bật/tắt theo
  # `push.transport` ở MỖI vòng lặp, nên đổi transport không cần restart pod. Công tắc cứng của
  # chúng — `Notification__ExpoReceipt__*` và `Notification__Fallback__*` — khai ở khối Sprint 6.3
  # phía dưới trong file này; đặt `Enabled: false` thì tắt hẳn kể cả khi transport có Expo.

  # ---------- Độ trễ thông báo chat: hai vòng poll nối tiếp ----------
  # chat → outbox (TicketService) --Outbox__IntervalSeconds--> RabbitMQ
  #      → dòng Pending (NotificationService) --Dispatch__PollIntervalSeconds--> SignalR
  # Mặc định trong code của cả hai là 5s ⇒ tổng ~10 giây, đủ để người dùng cho là hỏng.
  # Từ khi kênh Push thành đường realtime của chat (ADR-0019), phải ghim xuống 1s như compose.
  Outbox__IntervalSeconds: "1"
  Notification__Dispatch__PollIntervalSeconds: "1"

  # MailJet__FromEmail belongs to solar-secrets because production must use a
  # sender address verified by the account, never a repository default.
  MailJet__DisplayName: Solar Panel Battery Maintainance
  MailJet__SendEndpoint: https://api.mailjet.com/v3.1/send

  EmailTemplates__Path: wwwroot/email-templates
  EmailTemplates__CacheDisabled: "false"

  ObjectStorage__Provider: Minio
  ObjectStorage__ServiceUrl: http://minio:9000
  ObjectStorage__BucketName: solar-battery-files
  ObjectStorage__Region: us-east-1
  ObjectStorage__ForcePathStyle: "true"
  ObjectStorage__CreateBucketIfNotExists: "true"
  ObjectStorage__MaxFileSizeBytes: "10485760"

  Sms__Provider: Fake
  Sms__From: SolarBattery

  Outbox__BatchSize: "50"
  Outbox__PollIntervalSeconds: "2"
  Outbox__MaxRetries: "10"

  # ----- Sprint 6.3 — worker vận hành của NotificationService -----
  # Đều có mặc định trong code; đưa ra đây để chỉnh được mà không phải build lại image.
  # (`Notification__Unsubscribe__PublicBaseUrl` nằm ở configmap.yaml vì cần nội suy domain,
  #  `Notification__Unsubscribe__Secret` nằm ở solar-secrets.)
  Notification__ExpoReceipt__Enabled: "true"
  Notification__ExpoReceipt__MinAgeMinutes: "15"
  Notification__ExpoReceipt__PollIntervalSeconds: "300"
  Notification__Fallback__Enabled: "true"
  # PHẢI >= MinAgeMinutes(15) + chu kỳ quét(5) + biên(5) = 25. Thấp hơn thì fallback bắn SMS
  # trước khi worker đối soát kịp biết biên nhận ⇒ MỌI push critical lãnh thêm 1 SMS thừa,
  # không kèm lỗi kỹ thuật nào để lần ra. Service ghi LogError lúc khởi động nếu đặt sai.
  Notification__Fallback__PushReceiptTimeoutMinutes: "30"
  Notification__RateLimit__Enabled: "true"
  Notification__RateLimit__MaxPerUserPerHour: "20"
  Notification__RateLimit__MaxPerUserPerType: "8"
  Notification__Retention__Enabled: "true"
  Notification__Retention__Days: "90"
  Notification__Unsubscribe__TokenLifetimeDays: "180"

  # ----- Sprint additional-auth #AUTH-32 / #AUTH-59 — JWT refresh TTL + key rotation -----
  JwtSettings__RefreshTokenExpirationDays: "7"
  JwtSettings__SigningKeyId: "v1"
  JwtSettings__PreviousSigningKeyId: "v0"

  # ----- Sprint additional-auth #AUTH-53 — Password policy configurable -----
  PasswordPolicy__MinLength: "12"
  PasswordPolicy__MaxLength: "100"
  PasswordPolicy__RequireUppercase: "true"
  PasswordPolicy__RequireLowercase: "true"
  PasswordPolicy__RequireDigit: "true"
  PasswordPolicy__RequireSpecialChar: "true"

  # ----- Sprint additional-auth #AUTH-12 — RefreshToken device binding (IP/UA) -----
  AuthSecurity__EnforceDeviceBinding: "true"

  # ----- Sprint additional-auth #AUTH-41 — Concurrent session limit -----
  Session__MaxConcurrentSessions: "5"

  Idempotency__Enabled: "true"
  Idempotency__TtlHours: "24"

  Inbox__TtlDays: "7"
  Inbox__FailOpenWhenRedisDown: "false"

  GoogleOAuth__Scope: openid email profile

  ADMIN_EMAIL: admin@example.com

  # ----- Sprint 3 — BatteryService Anomaly Engine -----
  AnomalyEngine__ScanIntervalSeconds: "30"
  AnomalyEngine__DedupWindowMinutes: "30"
  AnomalyEngine__OfflineThresholdMinutes: "10"
  AnomalyEngine__EscalationAfterMinutes: "1"
  AnomalyEngine__EscalationIntervalSeconds: "60"
  AnomalyEngine__OutboxRelayIntervalSeconds: "5"
  AnomalyEngine__OutboxRelayBatchSize: "100"

  # ----- Sprint 5B #91/#102 — Environmental ingest API key -----
  # ----- Sprint 5B #90/#92 — Open-Meteo client + WeatherSync background -----
  Weather__BaseUrl: "https://api.open-meteo.com/"
  Weather__IntervalMinutes: "15"
  Weather__DedupWindowMinutes: "10"
  Weather__HttpTimeoutSeconds: "10"
  Weather__Enabled: "true"

  # ----- Sprint 5B #235 — MassTransit endpoint runtime tuning -----
  MessageBus__PrefetchCount: "32"
  MessageBus__ConcurrentMessageLimit: "16"

  # ----- Sprint 5B #238 — Alert-Ticket Saga feature flag cutover -----
  AlertTicketSaga__AlertTicketDispatchEnabled: "true"
  AlertTicketSaga__AlertTicketSagaEnabled: "true"

  # ----- Sprint IoT-1 #248 — IotDeviceOfflineDetectionBackgroundService -----
  Iot__OfflineCheckIntervalSeconds: "60"
  Iot__OfflineAfterSeconds: "300"
  Iot__OfflineBatchSize: "100"

  # ----- Sprint IoT-2 #IoT2-22..26 — MQTT bridge (CLIENT only) -----
  # Broker KHÔNG nằm trong chart này — deploy từ capstone/iot Helm chart riêng,
  # hoặc managed service (EMQX Cloud / HiveMQ). Backend chỉ chạy MqttBridgeBackgroundService client.
  # Mqtt__Password đặt trong Secret solar-secrets (xem deploy/README.md).
  Mqtt__Enabled: "false"           # Bật khi broker deployed + cấp credential
  Mqtt__Host: "mosquitto"          # K8s Service DNS chỉ dành cho BatteryService
  Mqtt__Port: "8883"
  Mqtt__PublicHost: "mqtt.example.com" # DNS mà ESP32 bên ngoài cluster truy cập được
  Mqtt__PublicPort: "8883"
  Mqtt__UseTls: "true"
  Mqtt__AllowUntrustedCertificates: "false"
  Mqtt__Username: "backend-bridge"
  Mqtt__ClientId: "battery-service-bridge"
  Mqtt__ReconnectIntervalSeconds: "5"

  # ----- Sprint IoT-2 #IoT2-35 — Firmware OTA artifact storage -----
  # Default: local PVC mount /data/firmware-storage (xem services.batteryservice.firmwareStorage).
  # Production: nên thay bằng object storage (S3/MinIO) — set Firmware__PublicBaseUrl tới CDN.
  Firmware__StorageRoot: "/data/firmware-storage"
  Firmware__PublicBaseUrl: ""

# --------------------------------------------------------------------
# IoT broker integration. Mosquitto runs with Docker on the same VPS,
# while BatteryService runs in k3s. The password directory is the only
# hostPath shared across the two runtimes.
# --------------------------------------------------------------------
iot:
  mqttPasswordSync:
    enabled: false
    hostPath: /opt/solar-iot/secrets/mosquitto
    mountPath: /mosquitto-config
    fileName: passwd
  # Optional split-DNS override. Set to the VPS private/VPC address if the
  # Reserved IP cannot hairpin back to the same Droplet. TLS still verifies
  # mqtt.<domain> because only DNS resolution changes.
  mqttNodeIp: ""
  mqttTlsCertificate:
    enabled: false
    secretName: mqtt-public-tls
    dnsName: ""

# --------------------------------------------------------------------
# Secret — placeholder. KHÔNG fill ở đây (sẽ commit lộ).
# Dùng `kubectl create secret` hoặc Sealed Secrets thay thế.
# Xem deploy/README.md hướng dẫn cách inject secret.
# --------------------------------------------------------------------
secrets:
  # Set externalSecretName nếu dùng Sealed Secrets / External Secrets Operator.
  # externalSecretName: solar-secrets
  externalSecretName: ""

# --------------------------------------------------------------------
# Monitoring
# Alertmanager sends Discord notifications natively through an
# AlertmanagerConfig SecretKeySelector. The webhook is never rendered into a
# manifest or mounted into the Alertmanager Pod.
# --------------------------------------------------------------------
# Sprint 7 #116 — Grafana Tempo (distributed tracing). Bật để deploy Tempo + auto-wire OTLP endpoint.
tempo:
  enabled: false
  image: grafana/tempo:latest
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "300m", memory: "384Mi" }
  retention: 48h

monitoring:
  ai:
    enabled: false
    domain: ""
    scrapeInterval: 15s
    scrapeTimeout: 10s
    applicationPort: 443
    nodeExporterPort: 9100
    cadvisorPort: 8082
    alloyPort: 12345

  alertmanagerDiscord:
    enabled: false
    name: solar-discord
    secretName: solar-secrets
    secretKey: DISCORD_WEBHOOK

  prometheusRules:
    enabled: false              # bật khi đã cài kube-prometheus-stack (CRD PrometheusRule)

  grafanaDashboards:
    enabled: false              # bật khi đã cài Grafana với sidecar dashboard discovery

  cadvisor:
    enabled: false
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 256Mi }
    serviceMonitor:
      enabled: true

  blackbox:
    enabled: false
    image: prom/blackbox-exporter:v0.25.0
    httpTargets: []
    mqttTarget: ""
    mqttServerName: ""
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }

# --------------------------------------------------------------------
# Subchart values — cover 8 monitoring service từ docker-compose
# Default: TẮT vì chart core nhẹ. Bật trong values-staging.yaml nếu cần.
# --------------------------------------------------------------------
kube-prometheus-stack:
  enabled: false
  fullnameOverride: monitoring     # service name ngắn (monitoring-prometheus, monitoring-grafana...)
  prometheus:
    prometheusSpec:
      retention: 15d
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits:   { cpu: 1,    memory: 2Gi }
      # Auto-discover ServiceMonitor + PrometheusRule từ chart này
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
  grafana:
    enabled: true
    adminPassword: changeme        # ← override trong values-staging
    # Dashboard/datasource sidecars only watch ConfigMaps in their own release
    # namespace. This avoids unnecessary cluster-wide reads and keeps the RBAC
    # contract namespaced.
    rbac:
      namespaced: true
    # Upstream test Pod reuses Grafana's Service selector labels and can become
    # an endpoint of the Service it probes. The chart-owned smoke Pod tests
    # Grafana with a dedicated non-matching label instead.
    testFramework:
      enabled: false
    sidecar:
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
        uid: prometheus
        resource: configmap
        searchNamespace: []
      dashboards:
        enabled: true
        label: grafana_dashboard   # match label trong grafana-dashboards-cm.yaml
        resource: configmap
        searchNamespace: []
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: []                    # ← set trong values-staging
  alertmanager:
    config:
      route:
        receiver: "null"
      receivers:
      - name: "null"

loki-stack:
  enabled: false
  loki:
    fullnameOverride: loki
    # Prometheus is the single default datasource. Grafana rejects datasource
    # provisioning when both Prometheus and Loki declare isDefault=true.
    isDefault: false
    datasource:
      uid: loki
    persistence:
      enabled: true
      size: 10Gi
  promtail:
    enabled: true
    config:
      clients:
      - url: http://loki:3100/loki/api/v1/push

postgres-exporter:
  enabled: false
  config:
    datasource:
      host: postgres
      user: postgres
      passwordSecret:
        name: solar-secrets
        key: POSTGRES_PASSWORD
      database: auth_db
      sslmode: disable

redis-exporter:
  enabled: false
  redisAddress: redis://redis:6379

# --------------------------------------------------------------------
# ResourceQuota — cap tổng resource trong namespace solar-staging.
# Tính toán: 5 service × (limits 500m × 512Mi) + infra 2 vCPU × 4Gi + monitoring 2 vCPU × 4Gi
# = ~7 vCPU × ~11Gi cho dev. Staging upgrade lên trong values-staging.yaml.
# --------------------------------------------------------------------
resourceQuota:
  enabled: false              # bật trong values-staging
  requestsCpu: "4"
  requestsMemory: "8Gi"
  limitsCpu: "8"
  limitsMemory: "16Gi"
  pvcs: "10"
