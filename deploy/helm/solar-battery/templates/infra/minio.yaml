{{- if .Values.minio.enabled -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "minio") | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      containers:
      - name: minio
        image: {{ .Values.minio.image }}
        args: [server, /data, --console-address, ":9001"]
        ports:
        - { name: s3,      containerPort: 9000 }
        - { name: console, containerPort: 9001 }
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: ObjectStorage__SecretKey }
        - name: MINIO_PROMETHEUS_AUTH_TYPE
          value: public
        - name: MINIO_SERVER_URL
          value: "https://files.{{ .Values.global.domain }}"
        readinessProbe:
          httpGet: { path: /minio/health/live, port: s3 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /minio/health/live, port: s3 }
          periodSeconds: 30
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: minio
  ports:
  - { name: s3,      port: 9000, targetPort: s3 }
  - { name: console, port: 9001, targetPort: console }
{{- if .Values.minio.ingress.enabled }}
---
# MinIO S3 API — files.* dùng cho ObjectStorage__PublicBaseUrl (client download)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-s3
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tlsIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts: ["files.{{ .Values.global.domain }}"]
    secretName: minio-s3-tls
  rules:
  - host: "files.{{ .Values.global.domain }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port: { name: s3 }
---
# MinIO Console — minio.* dùng để quản lý bucket qua UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tlsIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts: ["minio.{{ .Values.global.domain }}"]
    secretName: minio-console-tls
  rules:
  - host: "minio.{{ .Values.global.domain }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port: { name: console }
{{- end }}
---
# Init Job — tạo bucket + set anonymous read policy lần đầu (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ .Values.global.imageTag | trunc 12 | lower | replace "_" "-" }}
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "minio-init") | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.minio.initJob.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ .Values.minio.initJob.ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "minio-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        resources:
          {{- toYaml .Values.minio.initJob.resources | nindent 10 }}
        command:
        - sh
        - -c
        - |
          # Đợi minio sẵn sàng
          set -eu
          echo "MinIO init: waiting for MinIO service"
          ready=0
          for attempt in $(seq 1 120); do
            if mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
              if mc ready local >/dev/null 2>&1; then
                echo "MinIO init: MinIO is ready after attempt ${attempt}"
                ready=1
                break
              fi
            fi
            echo "MinIO init: waiting for MinIO (${attempt}/120)"
            sleep 3
          done

          if [ "$ready" != "1" ]; then
            echo "FAIL: MinIO did not become ready after 360 seconds"
            exit 1
          fi

          echo "MinIO init: ensuring bucket ${MINIO_BUCKET_NAME}"
          if mc ls "local/${MINIO_BUCKET_NAME}" >/dev/null 2>&1; then
            echo "MinIO init: bucket ${MINIO_BUCKET_NAME} already exists"
          else
            echo "MinIO init: creating bucket ${MINIO_BUCKET_NAME}"
            mc mb -p "local/${MINIO_BUCKET_NAME}"
          fi

          echo "MinIO init: setting anonymous download policy"
          mc anonymous set download "local/${MINIO_BUCKET_NAME}"

          echo "MinIO init: verifying bucket ${MINIO_BUCKET_NAME}"
          mc ls "local/${MINIO_BUCKET_NAME}" >/dev/null
          echo "MinIO init: bucket ${MINIO_BUCKET_NAME} ready"
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: ObjectStorage__SecretKey }
        - name: MINIO_BUCKET_NAME
          value: {{ .Values.minio.bucketName | quote }}
        - name: MC_CONFIG_DIR
          value: /tmp/.mc
{{- end }}
