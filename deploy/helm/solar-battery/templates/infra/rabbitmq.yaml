{{- if .Values.rabbitmq.enabled -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "rabbitmq") | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: {{ .Values.rabbitmq.image }}
        ports:
        - { name: amqp,    containerPort: 5672 }
        - { name: mgmt,    containerPort: 15672 }
        - { name: metrics, containerPort: 15692 }
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: {{ .Values.rabbitmq.username | quote }}
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: RabbitMQ__Password }
        - name: RABBITMQ_DEFAULT_VHOST
          value: {{ .Values.rabbitmq.virtualHost | default "/" | quote }}
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: "-rabbitmq_prometheus return_per_object_metrics {{ ternary "true" "false" .Values.rabbitmq.returnPerObjectMetrics }}"
        # Enable plugin Prometheus + Management lúc start
        command:
        - bash
        - -c
        - |
          rabbitmq-plugins enable --offline rabbitmq_prometheus rabbitmq_management
          rabbitmq-server
        # Keep kubelet health checks independent from the Erlang scheduler.
        # `rabbitmq-diagnostics ping` briefly consumed most of the broker CPU on
        # R4, timed out under rollout load and caused kubelet to restart a
        # healthy broker. The AMQP listener is a cheap, direct availability
        # signal; deeper broker health remains covered by Prometheus and the
        # post-deploy smoke tests.
        startupProbe:
          tcpSocket:
            port: amqp
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: amqp
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: amqp
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          {{- toYaml .Values.rabbitmq.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.rabbitmq.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "rabbitmq") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: rabbitmq
  ports:
  - { name: amqp,    port: 5672,  targetPort: amqp }
  - { name: mgmt,    port: 15672, targetPort: mgmt }
  - { name: metrics, port: 15692, targetPort: metrics }
{{- if .Values.rabbitmq.ingress.enabled }}
---
# RabbitMQ Management UI — expose qua Ingress (chỉ bật staging/prod)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-mgmt
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tlsIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts: ["rabbitmq.{{ .Values.global.domain }}"]
    secretName: rabbitmq-tls
  rules:
  - host: "rabbitmq.{{ .Values.global.domain }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq
            port: { name: mgmt }
{{- end }}
{{- end }}
