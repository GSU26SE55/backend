{{- if .Values.redis.enabled -}}
---
# Redis dev/staging — không persist, chấp nhận mất cache khi restart.
# Production muốn persist → đổi sang StatefulSet + PVC + AOF/RDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }    # KHÔNG rolling update — Redis 1 instance
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        ports:
        - { name: redis, containerPort: 6379 }
        readinessProbe:
          exec: { command: [redis-cli, ping] }
        livenessProbe:
          exec: { command: [redis-cli, ping] }
          periodSeconds: 10
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
  ports:
  - { name: redis, port: 6379, targetPort: redis }
{{- end }}
