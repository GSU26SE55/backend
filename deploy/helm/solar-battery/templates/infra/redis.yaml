{{- if .Values.redis.enabled -}}
---
# Redis keeps idempotency/replay/backplane state. A single-node deployment is
# intentionally a StatefulSet with AOF so a pod restart does not silently erase it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "redis") | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        args:
        - redis-server
        - --appendonly
        - {{ ternary "yes" "no" .Values.redis.appendOnly | quote }}
        - --appendfsync
        - everysec
        ports:
        - { name: redis, containerPort: 6379 }
        readinessProbe:
          exec: { command: [redis-cli, ping] }
        livenessProbe:
          exec: { command: [redis-cli, ping] }
          periodSeconds: 10
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
  ports:
  - { name: redis, port: 6379, targetPort: redis }
{{- end }}
