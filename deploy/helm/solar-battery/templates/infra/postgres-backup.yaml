{{- if and .Values.postgres.enabled .Values.minio.enabled -}}
---
# Dump every application database, verify that each archive is readable, then
# upload one timestamped directory to the private MinIO backup bucket.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "postgres-backup") | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.postgres.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "postgres-backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- include "solar.podSecurityContext" . | nindent 12 }}
          initContainers:
          - name: dump
            image: {{ .Values.postgres.clientImage }}
            securityContext:
              {{- include "solar.containerSecurityContext" . | nindent 14 }}
            resources:
              {{- toYaml .Values.postgres.backup.resources | nindent 14 }}
            env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASES
              value: >-
                {{ .Values.postgres.database }}
                {{ .Values.postgres.fileStorageDatabase }}
                {{ .Values.postgres.batteryDatabase }}
                {{ .Values.postgres.ticketDatabase }}
                {{ .Values.postgres.notificationDatabase }}
                {{ .Values.postgres.smsDatabase }}
                {{ .Values.postgres.auditAggregatorDatabase }}
            - name: PG_DUMP_LOCK_WAIT_TIMEOUT
              value: {{ .Values.postgres.backup.lockWaitTimeout | quote }}
            - name: PG_DUMP_TIMEOUT_SECONDS
              value: {{ .Values.postgres.backup.databaseTimeoutSeconds | quote }}
            - name: PG_DUMP_MAX_ATTEMPTS
              value: {{ .Values.postgres.backup.maxAttempts | quote }}
            - name: PG_DUMP_RETRY_DELAY_SECONDS
              value: {{ .Values.postgres.backup.retryDelaySeconds | quote }}
            command: ["/bin/sh", "-ec"]
            args:
            - |
              timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
              destination="/backup/${timestamp}"
              mkdir -p "${destination}"

              for database in ${DATABASES}; do
                archive="${destination}/${database}.dump"
                attempt=1

                while [ "${attempt}" -le "${PG_DUMP_MAX_ATTEMPTS}" ]; do
                  rm -f "${archive}"
                  echo "Backing up ${database} (attempt ${attempt}/${PG_DUMP_MAX_ATTEMPTS})"

                  if timeout -k 15 "${PG_DUMP_TIMEOUT_SECONDS}" \
                    pg_dump --verbose --format=custom --compress=6 \
                      --lock-wait-timeout="${PG_DUMP_LOCK_WAIT_TIMEOUT}" \
                      --file="${archive}" "${database}" \
                    && pg_restore --list "${archive}" >/dev/null; then
                    echo "Verified backup for ${database}"
                    break
                  else
                    dump_status="$?"
                  fi

                  rm -f "${archive}"
                  if [ "${attempt}" -ge "${PG_DUMP_MAX_ATTEMPTS}" ]; then
                    echo "Backup failed for ${database} after ${attempt} attempts (exit ${dump_status})" >&2
                    exit "${dump_status}"
                  fi

                  echo "Backup attempt ${attempt} failed for ${database} (exit ${dump_status}); retrying" >&2
                  attempt="$((attempt + 1))"
                  sleep "${PG_DUMP_RETRY_DELAY_SECONDS}"
                done
              done

              (cd "${destination}" && sha256sum ./*.dump > SHA256SUMS)
              printf '%s\n' "${timestamp}" > /backup/TIMESTAMP
            volumeMounts:
            - name: backup
              mountPath: /backup
          containers:
          - name: upload
            image: {{ .Values.minio.clientImage }}
            securityContext:
              {{- include "solar.containerSecurityContext" . | nindent 14 }}
            resources:
              {{- toYaml .Values.postgres.backup.resources | nindent 14 }}
            env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: solar-secrets, key: ObjectStorage__AccessKey }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: solar-secrets, key: ObjectStorage__SecretKey }
            - name: BACKUP_BUCKET
              value: {{ .Values.postgres.backup.bucket | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.postgres.backup.retentionDays | quote }}
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            command: ["/bin/sh", "-ec"]
            args:
            - |
              timestamp="$(cat /backup/TIMESTAMP)"
              mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
              mc mb --ignore-existing "local/${BACKUP_BUCKET}"
              mc cp --recursive "/backup/${timestamp}/" "local/${BACKUP_BUCKET}/${timestamp}/"
              mc rm --recursive --force --older-than "${RETENTION_DAYS}d" "local/${BACKUP_BUCKET}/" || true
              mc stat "local/${BACKUP_BUCKET}/${timestamp}/SHA256SUMS" >/dev/null
              echo "PostgreSQL backup ${timestamp} uploaded and verified"
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            emptyDir:
              sizeLimit: 8Gi
{{- end }}
