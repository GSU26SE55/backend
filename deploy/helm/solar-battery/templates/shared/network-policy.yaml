{{/*
  NetworkPolicy — security baseline.
  Default-deny tất cả traffic. Sau đó cho phép cụ thể từng cặp (gateway → service, service → infra).
  Loại bỏ "lateral movement" nếu 1 pod bị compromise.
*/}}
---
# 1. Default-deny: pod nào không match policy nào sẽ KHÔNG được nhận traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}                       # match all pod
  policyTypes: [Ingress]
---
# 2. ApiGateway nhận traffic từ Ingress controller (Traefik) ở namespace traefik/kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-apigateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: apigateway
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: TCP, port: 8080 }
---
# Traefik -> MinIO public endpoints (S3 API + Console).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: minio
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: TCP, port: 9000 }
    - { protocol: TCP, port: 9001 }
---
# Traefik -> RabbitMQ Management UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-rabbitmq-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: TCP, port: 15672 }
---
# ApiGateway -> backend services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
spec:
  podSelector:
    matchExpressions:
    - { key: app.kubernetes.io/component, operator: In, values: [authservice, emailservice, smsservice, filestorageservice, batteryservice, ticketservice, notificationservice, auditaggregatorservice] }
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: apigateway
    ports:
    - { protocol: TCP, port: 8080 }
---
# 4. Database-backed services → Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [authservice, filestorageservice, batteryservice, ticketservice, notificationservice, smsservice, auditaggregatorservice, postgres-database-init, postgres-backup] }
    ports:
    - { protocol: TCP, port: 5432 }
---
# 5. Tất cả service → Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [apigateway, authservice, emailservice, smsservice, filestorageservice, batteryservice, ticketservice, notificationservice, auditaggregatorservice] }
    ports:
    - { protocol: TCP, port: 6379 }
---
# 6. Tất cả service → RabbitMQ
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [apigateway, authservice, emailservice, smsservice, filestorageservice, batteryservice, ticketservice, notificationservice, auditaggregatorservice] }
    ports:
    - { protocol: TCP, port: 5672 }
    - { protocol: TCP, port: 15672 }
    - { protocol: TCP, port: 15692 }
---
# 7. FileStorageService → Minio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-filestorage-to-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: minio
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [filestorageservice, minio-init, postgres-backup] }
    ports:
    - { protocol: TCP, port: 9000 }
    - { protocol: TCP, port: 9001 }
---
# 8. Prometheus scrape /metrics của backend/gateway services.
# Cho phép kubelet probe nữa (kubelet đi từ node IP — empty selector match all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-and-kubelet
spec:
  podSelector:
    matchExpressions:
    - { key: app.kubernetes.io/component, operator: In, values: [apigateway, authservice, emailservice, smsservice, filestorageservice, batteryservice, ticketservice, notificationservice, auditaggregatorservice, cadvisor] }
  ingress:
  # Prometheus pod (kube-prometheus-stack)
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - { protocol: TCP, port: 8080 }
  # Kubelet livenessProbe/readinessProbe — không có label, cần match-all
  - from: []
    ports:
    - { protocol: TCP, port: 8080 }
---
# TicketService calls FileStorageService over its internal HTTP/2 gRPC listener.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ticket-to-filestorage-grpc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: filestorageservice
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: ticketservice
    ports:
    - { protocol: TCP, port: 8081 }
---
# Application services export traces to Tempo through OTLP gRPC/HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ticket-to-battery-grpc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: batteryservice
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: ticketservice
    ports:
    - { protocol: TCP, port: 8081 }
---
# Application services export traces to Tempo through OTLP gRPC/HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-tempo
spec:
  podSelector:
    matchLabels:
      app: tempo
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [apigateway, authservice, emailservice, smsservice, filestorageservice, batteryservice, ticketservice, notificationservice, auditaggregatorservice] }
    ports:
    - { protocol: TCP, port: 4317 }
    - { protocol: TCP, port: 4318 }
---
# Monitoring internal traffic:
# - Prometheus scrapes app, infra, exporter, Grafana, Alertmanager, Loki,
#   Promtail, and cAdvisor metrics; it also delivers alerts to Alertmanager.
# - Grafana reads Prometheus, Alertmanager, Loki, and Tempo.
# - Promtail pushes logs to Loki.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-stack
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - { protocol: TCP, port: 8080 }
    - { protocol: TCP, port: 9000 }
    - { protocol: TCP, port: 15692 }
    - { protocol: TCP, port: 9187 }
    - { protocol: TCP, port: 9121 }
    - { protocol: TCP, port: 9100 }
    - { protocol: TCP, port: 3000 }
    - { protocol: TCP, port: 9093 }
    - { protocol: TCP, port: 3100 }
    - { protocol: TCP, port: 3101 }
    - { protocol: TCP, port: 9115 }
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: promtail
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
    ports:
    - { protocol: TCP, port: 9090 }
    - { protocol: TCP, port: 3100 }
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - { protocol: TCP, port: 9093 }
    - { protocol: TCP, port: 3200 }
---
# The chart-owned smoke Pod has a dedicated label that cannot match Grafana's
# Service selector. Allow only that Pod to probe Grafana's container port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helm-smoke-to-grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: helm-smoke-test
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3000
---
# Allow the same smoke Pod to query Tempo readiness. Application trace ingress
# remains restricted to the OTLP ports in allow-services-to-tempo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helm-smoke-to-tempo
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: helm-smoke-test
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3200
---
# Traefik -> Grafana UI from kube-prometheus-stack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: TCP, port: 3000 }
---
# Grafana dashboard/datasource sidecars watch ConfigMaps through the in-cluster
# Kubernetes Service (10.43.0.1:443 on k3s). kube-proxy DNATs that Service to
# the node API endpoint on 6443 before the k3s NetworkPolicy controller applies
# its egress port check, so both the Service and endpoint ports are required.
# Scope this exception to the Grafana Pod instead of opening 6443 namespace-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-kubernetes-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
  - ports:
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 6443 }
---
# 9. cert-manager ACME HTTP-01 solver pods — Traefik cần reach port 8089 để forward challenge.
# Solver pods do cert-manager tạo ra, không có label app.kubernetes.io/*, nên cần policy riêng.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: TCP, port: 8089 }
  policyTypes: [Ingress]
---
# 10. Egress — cho phép DNS + cluster-internal + Internet (Mailjet, Google OAuth)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-internet
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  # DNS (CoreDNS)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  # Cluster-internal (Postgres, Redis, RabbitMQ, Minio, services)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
  # Internet egress (HTTPS) — Mailjet, Google OAuth, ghcr.io
  - to: []
    ports:
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 80 }
    # BatteryService -> same-VPS Mosquitto public TLS listener.
    - { protocol: TCP, port: 8883 }
{{- if and .Values.monitoring.ai.enabled .Values.wireguard.enabled }}
---
# Prometheus is the only in-cluster workload allowed to reach the AI host
# exporters. The /32 prevents this exception from opening the wider VPN subnet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-ai-wireguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock:
        cidr: {{ printf "%s/32" .Values.wireguard.aiIpv4 | quote }}
    ports:
    - { protocol: TCP, port: {{ .Values.monitoring.ai.applicationPort }} }
    - { protocol: TCP, port: {{ .Values.monitoring.ai.nodeExporterPort }} }
    - { protocol: TCP, port: {{ .Values.monitoring.ai.cadvisorPort }} }
    - { protocol: TCP, port: {{ .Values.monitoring.ai.alloyPort }} }
{{- end }}
