{{/*
  NetworkPolicy — security baseline.
  Default-deny tất cả traffic. Sau đó cho phép cụ thể từng cặp (gateway → service, service → infra).
  Loại bỏ "lateral movement" nếu 1 pod bị compromise.
*/}}
---
# 1. Default-deny: pod nào không match policy nào sẽ KHÔNG được nhận traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}                       # match all pod
  policyTypes: [Ingress]
---
# 2. ApiGateway nhận traffic từ Ingress controller (Traefik) ở namespace traefik/kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-apigateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: apigateway
  ingress:
  - from:
    - namespaceSelector: {}             # mọi namespace (Traefik thường ở kube-system)
    ports:
    - { protocol: TCP, port: 8080 }
---
# Traefik -> MinIO public endpoints (S3 API + Console).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: minio
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - { protocol: TCP, port: 9000 }
    - { protocol: TCP, port: 9001 }
---
# Traefik -> RabbitMQ Management UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-rabbitmq-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - { protocol: TCP, port: 15672 }
---
# ApiGateway -> backend services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
spec:
  podSelector:
    matchExpressions:
    - { key: app.kubernetes.io/component, operator: In, values: [authservice, emailservice, smsservice, filestorageservice, batteryservice] }
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: apigateway
    ports:
    - { protocol: TCP, port: 8080 }
---
# 4. Database-backed services → Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [authservice, filestorageservice, batteryservice, postgres-database-init] }
    ports:
    - { protocol: TCP, port: 5432 }
---
# 5. Tất cả service → Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/name, operator: In, values: [solar-battery] }
    ports:
    - { protocol: TCP, port: 6379 }
---
# 6. Tất cả service → RabbitMQ
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/name, operator: In, values: [solar-battery] }
    ports:
    - { protocol: TCP, port: 5672 }
    - { protocol: TCP, port: 15672 }
    - { protocol: TCP, port: 15692 }
---
# 7. FileStorageService → Minio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-filestorage-to-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: minio
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - { key: app.kubernetes.io/component, operator: In, values: [filestorageservice, minio-init] }
    ports:
    - { protocol: TCP, port: 9000 }
    - { protocol: TCP, port: 9001 }
---
# 8. Prometheus scrape /metrics của backend/gateway services.
# Cho phép kubelet probe nữa (kubelet đi từ node IP — empty selector match all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-and-kubelet
spec:
  podSelector:
    matchExpressions:
    - { key: app.kubernetes.io/component, operator: In, values: [apigateway, authservice, emailservice, smsservice, filestorageservice, batteryservice] }
  ingress:
  # Prometheus pod (kube-prometheus-stack)
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - { protocol: TCP, port: 8080 }
  # Kubelet livenessProbe/readinessProbe — không có label, cần match-all
  - from: []
    ports:
    - { protocol: TCP, port: 8080 }
---
# 9. cert-manager ACME HTTP-01 solver pods — Traefik cần reach port 8089 để forward challenge.
# Solver pods do cert-manager tạo ra, không có label app.kubernetes.io/*, nên cần policy riêng.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  ingress:
  - ports:
    - { protocol: TCP, port: 8089 }
  policyTypes: [Ingress]
---
# 10. Egress — cho phép DNS + cluster-internal + Internet (Mailjet, Google OAuth)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-internet
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  # DNS (CoreDNS)
  - to:
    - namespaceSelector: {}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  # Cluster-internal (Postgres, Redis, RabbitMQ, Minio, services)
  - to:
    - namespaceSelector: {}
  # Internet egress (HTTPS) — Mailjet, Google OAuth, ghcr.io
  - to: []
    ports:
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 80 }
