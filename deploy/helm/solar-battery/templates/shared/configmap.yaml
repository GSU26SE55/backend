{{/* ConfigMap chứa toàn bộ non-secret config — mọi service envFrom block này */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: solar-config
  labels:
    {{- include "solar.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.global.aspnetEnvironment | quote }}
  ASPNETCORE_URLS: "http://+:8080"

  # Sprint 7 #116 — OpenTelemetry → Tempo. Tự wire khi tempo.enabled; ngược lại để trống (tracing tắt).
  OpenTelemetry__OtlpEndpoint: {{ if .Values.tempo.enabled }}"http://tempo:4317"{{ else }}{{ .Values.global.otlpEndpoint | default "" | quote }}{{ end }}

  # Database-backed services set their connection strings in their Deployment
  # so Kubernetes can expand POSTGRES_PASSWORD from an explicit env var.

  # ApiGateway upstreams trong K8s. appsettings.json dùng localhost cho local dev,
  # nên K8s cần override bằng service DNS nội bộ.
  ReverseProxy__Clusters__authCluster__Destinations__destination1__Address: "http://authservice:80"
  ReverseProxy__Clusters__fileStorageCluster__Destinations__destination1__Address: "http://filestorageservice:80"
  ReverseProxy__Clusters__batteryCluster__Destinations__destination1__Address: "http://batteryservice:80"
  ReverseProxy__Clusters__ticketCluster__Destinations__destination1__Address: "http://ticketservice:80"
  ReverseProxy__Clusters__notificationCluster__Destinations__destination1__Address: "http://notificationservice:80"
  ReverseProxy__Clusters__smsCluster__Destinations__destination1__Address: "http://smsservice:80"

  # Object Storage URLs build từ domain
  ObjectStorage__PublicServiceUrl: "https://files.{{ .Values.global.domain }}"
  ObjectStorage__PublicBaseUrl: "https://files.{{ .Values.global.domain }}/{{ .Values.minio.bucketName }}"

  # Google OAuth callback — build theo domain
  GoogleOAuth__RedirectUri: "https://api.{{ .Values.global.domain }}/auth-service/api/auth/google/callback"
  GoogleOAuth__FrontendCallbackUrl: "https://{{ .Values.global.domain }}/auth/google-callback"

  # Admin invite email link — EmailService append ?token=...
  AdminInvite__AcceptUrlBase: "https://{{ .Values.global.domain }}/auth/accept-invite"

  # Sprint 6.3 NOTI3-15 — gốc URL cho link hủy đăng ký một chạm trong email.
  # Gmail/Yahoo POST thẳng vào URL này (List-Unsubscribe-Post), nên phải là domain công khai
  # thật. Ingress của apigateway phục vụ host api.{domain} ở path "/", còn controller nằm tại
  # /api/notification-unsubscribe ⇒ base đúng là https://api.{domain}.
  # Thiếu biến này thì EmailBusChannel vẫn gửi email nhưng bỏ header List-Unsubscribe và chỉ
  # ghi 1 dòng LogWarning — im lặng về phía người dùng.
  Notification__Unsubscribe__PublicBaseUrl: "https://api.{{ .Values.global.domain }}"

  # #AUTH-51 — Frontend Web app base URL (cross-device 2FA confirm email link).
  # AuthService dùng `Frontend:WebBaseUrl` để build URL "https://{domain}/2fa/cross-device-confirm?token=..."
  Frontend__WebBaseUrl: "https://{{ .Values.global.domain }}"

  # Tất cả entry còn lại lấy từ .Values.config map
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
