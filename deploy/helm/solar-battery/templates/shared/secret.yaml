{{/*
  Secret chứa thông tin nhạy cảm — KHÔNG commit value thật vào git.

  3 cách inject value (chọn 1):

  1. CLI manual khi setup lần đầu:
     kubectl create secret generic solar-secrets \
       --namespace solar-staging \
       --from-literal=POSTGRES_PASSWORD='xxx' \
       --from-literal=JwtSettings__SecretKey='xxx' \
       ...

  2. Sealed Secrets (Bitnami) — encrypt rồi commit:
     kubeseal < secret-raw.yaml > sealed-secret.yaml
     Set values.secrets.externalSecretName=solar-secrets

  3. External Secrets Operator + Vault/AWS Secrets Manager — production-grade.

  Template này chỉ tạo Secret RỖNG để service mount được. User phải
  patch hoặc replace bằng values thật sau.
*/}}
{{/*
  Helm template lookup — nếu Secret `solar-secrets` đã tồn tại (do user tạo manual
  trước khi install), Helm SKIP tạo placeholder. Tránh xung đột manual vs Helm.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "solar-secrets" }}
{{- if and (not .Values.secrets.externalSecretName) (not $existing) }}
apiVersion: v1
kind: Secret
metadata:
  name: solar-secrets
  labels:
    {{- include "solar.labels" . | nindent 4 }}
  annotations:
    # Placeholder để Helm install không fail.
    # Sau install, replace bằng `kubectl apply` Secret thật.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # PLACEHOLDER — replace bằng giá trị thật qua kubectl/Sealed Secrets
  POSTGRES_PASSWORD: "CHANGE_ME"
  RabbitMQ__Password: "CHANGE_ME"
  JwtSettings__SecretKey: "CHANGE_ME_AT_LEAST_32_CHARS"
  JwtSettings__Issuer: "https://api.{{ .Values.global.domain }}"
  JwtSettings__Audience: "https://api.{{ .Values.global.domain }}"
  MailJet__ApiKey: "CHANGE_ME"
  MailJet__ApiSecret: "CHANGE_ME"
  ObjectStorage__AccessKey: "CHANGE_ME"
  ObjectStorage__SecretKey: "CHANGE_ME"
  GoogleOAuth__ClientId: "CHANGE_ME"
  GoogleOAuth__ClientSecret: "CHANGE_ME"
  ADMIN_PASSWORD: "CHANGE_ME"
  DISCORD_WEBHOOK: "https://discord.com/api/webhooks/CHANGE_ME"
{{- end }}
