{{- $svc := .Values.services.auditaggregatorservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditaggregatorservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "auditaggregatorservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: auditaggregatorservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auditaggregatorservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      initContainers:
      - name: wait-audit-aggregator-db
        image: {{ .Values.postgres.clientImage | default "postgres:16-alpine" }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: AUDIT_AGGREGATOR_DB_NAME
          value: {{ .Values.postgres.auditAggregatorDatabase | quote }}
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting postgres..."; sleep 2
          done
          until psql --host=postgres --port=5432 --username="$POSTGRES_USER" --dbname=postgres \
            --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = '${AUDIT_AGGREGATOR_DB_NAME}'" | grep -q 1; do
            echo "waiting database ${AUDIT_AGGREGATOR_DB_NAME}..."; sleep 2
          done
          echo "audit aggregator database ready"
      containers:
      - name: auditaggregatorservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__AuditAggregatorDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.auditAggregatorDatabase }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /ready, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /live, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auditaggregatorservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "auditaggregatorservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: auditaggregatorservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
