{{- $svc := .Values.services.ticketservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "ticketservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  progressDeadlineSeconds: {{ .Values.global.rolloutProgressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ticketservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ticketservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- if and .Values.wireguard.enabled .Values.wireguard.aiIpv4 }}
      # Preserve the public certificate name while sending TicketService's AI
      # gRPC traffic over the encrypted inter-VPS tunnel.
      hostAliases:
      - ip: {{ .Values.wireguard.aiIpv4 | quote }}
        hostnames:
        - {{ printf "ai.%s" .Values.global.domain | quote }}
      {{- end }}
      securityContext:
        {{- include "solar.podSecurityContext" . | nindent 8 }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      initContainers:
      - name: wait-ticket-db
        image: {{ .Values.postgres.clientImage | default "postgres:16-alpine" }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: TICKET_DB_NAME
          value: {{ .Values.postgres.ticketDatabase | quote }}
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting postgres..."; sleep 2
          done
          until psql --host=postgres --port=5432 --username="$POSTGRES_USER" --dbname=postgres \
            --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = '${TICKET_DB_NAME}'" | grep -q 1; do
            echo "waiting database ${TICKET_DB_NAME}..."; sleep 2
          done
          echo "ticket database ready"
      containers:
      - name: ticketservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image "digest" ($svc.digest | default "")) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- include "solar.containerSecurityContext" . | nindent 10 }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__TicketDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.ticketDatabase }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ticketservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "ticketservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: ticketservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
