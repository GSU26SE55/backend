{{/*
  ServiceMonitor — kube-prometheus-stack auto-discover dùng CRD này (không phải pod annotation).
  Render khi index .Values "kube-prometheus-stack" "enabled" = true (subchart đã cài).
*/}}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- if $kps.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "solar.labels" $ | nindent 4 }}
    # Label release để kube-prometheus-stack discover.
    # serviceMonitorSelectorNilUsesHelmValues=false trong subchart values → không cần match label.
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
{{- end }}
{{- end }}
{{- end }}
