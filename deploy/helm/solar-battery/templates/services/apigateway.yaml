{{- $svc := .Values.services.apigateway -}}
{{- if $svc.enabled -}}
---
# ApiGateway — entry point public, expose qua Ingress với TLS từ cert-manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "apigateway") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: apigateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: apigateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      containers:
      - name: apigateway
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        readinessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "apigateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: apigateway
  ports:
  - { name: http, port: 80, targetPort: http }
{{- if $svc.ingress.enabled }}
---
# Ingress public — domain trỏ về cluster IP, Traefik route theo Host header.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apigateway
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tlsIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts: ["api.{{ .Values.global.domain }}"]
    secretName: apigateway-tls
  rules:
  - host: "api.{{ .Values.global.domain }}"
    http:
      paths:
      - path: {{ $svc.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: apigateway
            port: { name: http }
{{- end }}
{{- end }}
