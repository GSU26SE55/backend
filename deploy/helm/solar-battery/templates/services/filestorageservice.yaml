{{- $svc := .Values.services.filestorageservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestorageservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "filestorageservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: filestorageservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: filestorageservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        {{- include "solar.podSecurityContext" . | nindent 8 }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      initContainers:
      - name: wait-file-storage-db
        image: {{ .Values.postgres.clientImage | default "postgres:16-alpine" }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: FILE_STORAGE_DB_NAME
          value: {{ .Values.postgres.fileStorageDatabase | quote }}
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting postgres..."; sleep 2
          done
          until psql --host=postgres --port=5432 --username="$POSTGRES_USER" --dbname=postgres \
            --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = '${FILE_STORAGE_DB_NAME}'" | grep -q 1; do
            echo "waiting database ${FILE_STORAGE_DB_NAME}..."; sleep 2
          done
          echo "file storage database ready"
      containers:
      - name: filestorageservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image "digest" ($svc.digest | default "")) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- include "solar.containerSecurityContext" . | nindent 10 }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        # GH-790 — cổng gRPC nội bộ (voice transcription + quét virus đính kèm). Khai biến địa chỉ
        # trong configmap mà không mở cổng ở đây thì `http://filestorageservice:8081` không định
        # tuyến tới đâu cả, và lỗi sẽ hiện ra dưới dạng "không quét được file" chứ không phải lỗi cấu hình.
        - { name: grpc, containerPort: 8081 }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__FileStorageDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.fileStorageDatabase }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: filestorageservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "filestorageservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: filestorageservice
  ports:
  - { name: http, port: 80, targetPort: http }
  # GH-790 — cổng gRPC nội bộ; giữ đúng số 8081 để khớp FILE_STORAGE_GRPC_CLIENT_ADDRESS.
  - { name: grpc, port: 8081, targetPort: grpc }
{{- end }}
