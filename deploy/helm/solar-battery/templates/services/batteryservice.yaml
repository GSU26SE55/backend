{{- $svc := .Values.services.batteryservice -}}
{{- if $svc.enabled -}}
{{- $fw := $svc.firmwareStorage | default dict -}}
{{- if $fw.enabled }}
---
# Sprint IoT-2 #IoT2-35 — PVC cho firmware OTA artifact (multipart upload).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: batteryservice-firmware-storage
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "batteryservice") | nindent 4 }}
spec:
  accessModes:
  - {{ $fw.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $fw.size | default "2Gi" }}
  {{- if $fw.storageClass }}
  storageClassName: {{ $fw.storageClass | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batteryservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "batteryservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: batteryservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: batteryservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.iot.mqttNodeIp }}
      # Keep the public MQTT DNS name for certificate verification while routing
      # same-VPS traffic over the Droplet/VPC address (avoids Reserved-IP hairpin).
      hostAliases:
      - ip: {{ .Values.iot.mqttNodeIp | quote }}
        hostnames:
        - {{ printf "mqtt.%s" .Values.global.domain | quote }}
      {{- end }}
      securityContext:
        {{- include "solar.podSecurityContext" . | nindent 8 }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      initContainers:
      - name: wait-battery-db
        image: {{ .Values.postgres.clientImage | default "postgres:16-alpine" }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: BATTERY_DB_NAME
          value: {{ .Values.postgres.batteryDatabase | quote }}
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting postgres..."; sleep 2
          done
          until psql --host=postgres --port=5432 --username="$POSTGRES_USER" --dbname=postgres \
            --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = '${BATTERY_DB_NAME}'" | grep -q 1; do
            echo "waiting database ${BATTERY_DB_NAME}..."; sleep 2
          done
          echo "battery database ready"
      containers:
      - name: batteryservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image "digest" ($svc.digest | default "")) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- include "solar.containerSecurityContext" . | nindent 10 }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        - { name: grpc, containerPort: {{ $svc.grpcPort }} }
        env:
        - name: Http__Port
          value: {{ $svc.port | quote }}
        - name: Grpc__Port
          value: {{ $svc.grpcPort | quote }}
        {{- if .Values.iot.mqttPasswordSync.enabled }}
        - name: Mqtt__PasswordFilePath
          value: {{ printf "%s/%s" .Values.iot.mqttPasswordSync.mountPath .Values.iot.mqttPasswordSync.fileName | quote }}
        {{- end }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__BatteryDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.batteryDatabase }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        {{- if or $fw.enabled .Values.iot.mqttPasswordSync.enabled }}
        volumeMounts:
        {{- if $fw.enabled }}
        - name: firmware-storage
          mountPath: {{ $fw.mountPath | default "/data/firmware-storage" }}
        {{- end }}
        {{- if .Values.iot.mqttPasswordSync.enabled }}
        - name: mqtt-password-sync
          mountPath: {{ .Values.iot.mqttPasswordSync.mountPath }}
        {{- end }}
        {{- end }}
      {{- if or $fw.enabled .Values.iot.mqttPasswordSync.enabled }}
      volumes:
      {{- if $fw.enabled }}
      - name: firmware-storage
        persistentVolumeClaim:
          claimName: batteryservice-firmware-storage
      {{- end }}
      {{- if .Values.iot.mqttPasswordSync.enabled }}
      - name: mqtt-password-sync
        hostPath:
          path: {{ .Values.iot.mqttPasswordSync.hostPath }}
          type: Directory
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: batteryservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "batteryservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: batteryservice
  ports:
  - { name: http, port: 80, targetPort: http }
  - { name: grpc, port: {{ $svc.grpcPort }}, targetPort: grpc }
{{- end }}
