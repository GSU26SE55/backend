{{- $svc := .Values.services.smsservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smsservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "smsservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable | quote }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/component: smsservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smsservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      containers:
      - name: smsservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        readinessProbe:
          httpGet: { path: /metrics, port: http }
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: smsservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: smsservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
