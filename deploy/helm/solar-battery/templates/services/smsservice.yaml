{{- $svc := .Values.services.smsservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smsservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "smsservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: smsservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smsservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      containers:
      - name: smsservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        env:
        # Sprint SMS — SMS Gateway Hub owns sms_db.
        # Pattern khớp AuthService: build ConnectionString inline để Kubernetes expand POSTGRES_PASSWORD secret.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__SmsDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.smsDatabase }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        # EF Core migration chạy lúc startup → cần startupProbe rộng tay (pattern khớp AuthService).
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
          initialDelaySeconds: 20
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: smsservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: smsservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
