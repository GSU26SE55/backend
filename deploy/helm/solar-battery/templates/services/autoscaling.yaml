{{/*
  HPA + PDB cho mọi service có autoscaling.enabled=true.
  Loop qua .Values.services map.

  ⚠️ File này TỪNG tên là `_autoscaling.yaml`. Helm coi mọi file trong templates/ bắt đầu bằng
  dấu gạch dưới là partial và KHÔNG render thành manifest — nên HPA/PDB chưa từng được tạo, âm
  thầm, dù values có bật hay không. (Nó không hề chứa block `define` nào, tức không phải partial
  thật; chỉ là đặt nhầm tên. Xem thêm `servicemonitor.yaml` dính đúng lỗi này.)

  `(default dict $svc.autoscaling).enabled` thay cho `$svc.autoscaling.enabled`: ba service
  (emailservice, filestorageservice, smsservice) không khai khoá `autoscaling`, viết cách cũ thì
  Helm dừng với "nil pointer evaluating interface {}.enabled" ngay khi file được render thật.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (default dict $svc.autoscaling).enabled }}
---
# HPA — auto scale {{ $name }} theo CPU utilization.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Đợi 5 phút trước khi scale down (tránh flapping)
    scaleUp:
      stabilizationWindowSeconds: 60
---
# PDB — guarantee tối thiểu 1 pod luôn live khi maintenance/upgrade.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
