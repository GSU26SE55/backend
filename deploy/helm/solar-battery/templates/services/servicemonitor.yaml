{{/*
  ServiceMonitor — kube-prometheus-stack auto-discover dùng CRD này (không phải pod annotation).
  Render khi index .Values "kube-prometheus-stack" "enabled" = true (subchart đã cài).

  ⚠️ File này TỪNG tên là `_servicemonitor.yaml`. Helm coi mọi file trong templates/ bắt đầu bằng
  dấu gạch dưới là partial và KHÔNG render thành manifest — nên trên K8s KHÔNG service ứng dụng
  nào có ServiceMonitor, tức Prometheus không scrape bất kỳ service nào trong 9 cái. Mọi alert
  dựa trên metric ứng dụng (notification, auth, chat, saga, outbox, iot, environmental…) không
  thể nổ, và dashboard Grafana trống — không có dấu hiệu nào báo ra ngoài.
  Kiểm chứng: `helm template` trước khi đổi tên ra 16 ServiceMonitor toàn của subchart/hạ tầng;
  sau khi đổi tên ra 25, thêm đúng 9 cái của service ứng dụng.

  Annotation `prometheus.io/scrape` trên Deployment KHÔNG thay thế được: kube-prometheus-stack
  discover qua CRD ServiceMonitor, không đọc annotation.
*/}}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- if $kps.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "solar.labels" $ | nindent 4 }}
    # Label release để kube-prometheus-stack discover.
    # serviceMonitorSelectorNilUsesHelmValues=false trong subchart values → không cần match label.
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
{{- end }}
{{- end }}
{{- end }}
