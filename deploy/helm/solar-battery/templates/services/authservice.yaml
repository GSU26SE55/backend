{{- $svc := .Values.services.authservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "authservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: authservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: authservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      # AuthService cần đợi Postgres ready trước khi migrate.
      # Dùng busybox 5MB thay postgres image 80MB → cold start nhanh hơn.
      initContainers:
      - name: wait-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "waiting postgres..."; sleep 2
          done
          echo "postgres ready"
      containers:
      - name: authservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        # EF Core migration chạy lúc startup → cần startupProbe rộng tay
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "authservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: authservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
