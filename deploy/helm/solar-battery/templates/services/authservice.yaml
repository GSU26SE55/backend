{{- $svc := .Values.services.authservice -}}
{{- if $svc.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "authservice") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/component: authservice
  template:
    metadata:
      labels:
        app.kubernetes.io/component: authservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- include "solar.podSecurityContext" . | nindent 8 }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      # AuthService cần đợi Postgres và auth_db ready trước khi migrate.
      initContainers:
      - name: wait-auth-db
        image: {{ .Values.postgres.clientImage | default "postgres:16-alpine" }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: AUTH_DB_NAME
          value: {{ .Values.postgres.database | quote }}
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
            echo "waiting postgres..."; sleep 2
          done
          until psql --host=postgres --port=5432 --username="$POSTGRES_USER" --dbname=postgres \
            --tuples-only --no-align \
            --command="SELECT 1 FROM pg_database WHERE datname = '${AUTH_DB_NAME}'" | grep -q 1; do
            echo "waiting database ${AUTH_DB_NAME}..."; sleep 2
          done
          echo "auth database ready"
      containers:
      - name: authservice
        image: {{ include "solar.image" (dict "Values" .Values "image" $svc.image "digest" ($svc.digest | default "")) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- include "solar.containerSecurityContext" . | nindent 10 }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: POSTGRES_PASSWORD }
        - name: ConnectionStrings__AuthDb
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD);Maximum Pool Size={{ .Values.postgres.connectionPool.maximumPoolSize }};Minimum Pool Size={{ .Values.postgres.connectionPool.minimumPoolSize }}"
        envFrom:
        - configMapRef: { name: solar-config }
        - secretRef:    { name: solar-secrets }
        # EF Core migration chạy lúc startup → cần startupProbe rộng tay
        startupProbe:
          httpGet: { path: /metrics, port: http }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /metrics, port: http }
          periodSeconds: 10
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        # GH-295 — Data Protection keys cho 2FA secret encryption.
        # Volume PHẢI persist cross-pod-restart. Mất volume = mất khả năng decrypt
        # mọi TwoFactorSecret trong DB. Backup cùng postgres-data.
        volumeMounts:
        - name: auth-dataprotection-keys
          mountPath: /app/keys
      volumes:
      - name: auth-dataprotection-keys
        persistentVolumeClaim:
          claimName: auth-dataprotection-keys-pvc
---
# GH-295 — PVC cho DataProtection keys. ReadWriteOnce vì AuthService chỉ chạy single-replica
# (key file là local state, không thể share giữa pods). Khi scale → cần chuyển sang Redis-backed
# IDataProtectionRepository thay vì file system.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-dataprotection-keys-pvc
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "authservice") | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ $svc.dataProtectionKeys.storage | default "128Mi" }}
  {{- if $svc.dataProtectionKeys.storageClass }}
  storageClassName: {{ $svc.dataProtectionKeys.storageClass | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "authservice") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: authservice
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
