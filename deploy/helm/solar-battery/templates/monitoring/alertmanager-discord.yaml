{{/*
  Alertmanager-discord relay — convert Alertmanager webhook JSON sang Discord native format.
  Chỉ deploy nếu monitoring.alertmanagerDiscord.enabled=true.

  Webhook URL Discord lưu trong Secret solar-secrets.DISCORD_WEBHOOK
  (tạo manual: kubectl create secret patch ...)
*/}}
{{- if .Values.monitoring.alertmanagerDiscord.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord
  labels:
    {{- include "solar.serviceLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "alertmanager-discord") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alertmanager-discord
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alertmanager-discord
    spec:
      containers:
      - name: relay
        image: benjojo/alertmanager-discord:latest
        ports:
        - { name: http, containerPort: 9094 }
        env:
        - name: DISCORD_WEBHOOK
          valueFrom:
            secretKeyRef: { name: solar-secrets, key: DISCORD_WEBHOOK }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-discord
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: alertmanager-discord
  ports:
  - { name: http, port: 9094, targetPort: http }
{{- end }}
