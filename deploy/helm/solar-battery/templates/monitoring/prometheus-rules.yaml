{{/*
  PrometheusRule CRD — kube-prometheus-stack auto-discover và load.
  Chỉ render khi monitoring.prometheusRules.enabled=true (cần có CRD `monitoring.coreos.com/v1`).

  Source content: monitoring/prometheus/alert-rules.yml (10 alert rule).
*/}}
{{- if .Values.monitoring.prometheusRules.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: solar-battery-rules
  labels:
    {{- include "solar.labels" . | nindent 4 }}
    # Label này yêu cầu kube-prometheus-stack discover (set qua chart values)
    release: monitoring
spec:
  groups:
  # ---- Service availability & error rates ----
  - name: service-health
    interval: 30s
    rules:
    - alert: ServiceDown
      expr: up{tier=~"backend|gateway"} == 0
      for: 1m
      labels: { severity: critical }
      annotations:
        summary: "Service {{`{{ $labels.service }}`}} is down"
        description: "Prometheus failed to scrape {{`{{ $labels.service }}`}} for over 1 minute."

    - alert: HighErrorRate
      expr: |
        (
          sum(rate(http_requests_received_total{code=~"5.."}[5m])) by (service)
          /
          sum(rate(http_requests_received_total[5m])) by (service)
        ) > 0.05
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "High 5xx rate on {{`{{ $labels.service }}`}}"
        description: "More than 5% of requests are 5xx errors over the last 5 minutes."

    - alert: HighLatencyP95
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
        ) > 1
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "p95 latency on {{`{{ $labels.service }}`}} > 1s"
        description: "Request latency degraded — investigate downstream calls."

  # ---- Messaging & Reliability patterns ----
  - name: messaging-reliability
    interval: 30s
    rules:
    - alert: OutboxBacklog
      expr: outbox_messages_pending_count > 100
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Outbox backlog > 100 messages"
        description: "{{`{{ $value }}`}} messages pending publish — RabbitMQ down or relay job stuck."

    - alert: OutboxPublishFailures
      expr: rate(outbox_messages_failures_total[5m]) > 1
      for: 2m
      labels: { severity: critical }
      annotations:
        summary: "Outbox publish failing"
        description: "Reasons: {{`{{ $labels.reason }}`}}. Likely RabbitMQ outage."

    - alert: OutboxPoisonMessages
      expr: increase(outbox_messages_skipped_total[10m]) > 0
      for: 1m
      labels: { severity: warning }
      annotations:
        summary: "Outbox skipped poison messages"
        description: "Messages reached MaxRetries — manual intervention required."

    - alert: HighInboxDuplicateRate
      expr: |
        (
          sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer)
          /
          (sum(rate(inbox_messages_processed_total[5m])) by (consumer)
           + sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer))
        ) > 0.5
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Consumer {{`{{ $labels.consumer }}`}} duplicate rate > 50%"
        description: "Consumer is retrying too often — check ack logic."

    - alert: IdempotencyConflictSpike
      expr: rate(idempotency_key_conflicts_total[5m]) > 0.5
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Idempotency conflicts spike"
        description: "Client may be sending parallel duplicate requests."

  # ---- Alert-Ticket Saga (Sprint 5B #239) ----
  - name: alert-ticket-saga
    interval: 30s
    rules:
    - alert: SagaFailedRateSpike
      expr: increase(saga_alert_ticket_failed_total[5m]) > 5
      for: 2m
      labels: { severity: critical }
      annotations:
        summary: "Alert-Ticket Saga failures {{`{{ $value }}`}} in 5m"
        description: "Reason {{`{{ $labels.reason }}`}}. Runbook: docs/runbooks/08-saga-failed.md"

    - alert: SagaStuck
      expr: saga_alert_ticket_active_count > 50
      for: 15m
      labels: { severity: warning }
      annotations:
        summary: "Saga active count {{`{{ $value }}`}} over 15min"
        description: "Quartz timer drift or consumer crash. Runbook: docs/runbooks/09-saga-stuck.md"

  # ---- Sprint IoT-1 — IoT edge device fleet ----
  - name: iot-device-fleet
    interval: 30s
    rules:
    - alert: IotDeviceOfflineSpike
      expr: increase(iot_devices_marked_offline_total[5m]) > 3
      for: 2m
      labels: { severity: warning }
      annotations:
        summary: "{{`{{ $value }}`}} IoT device(s) marked Offline in 5m"
        description: "Check WiFi/network at site, MQTT broker status, heartbeat handler."

    - alert: IotHeartbeatStall
      expr: |
        rate(iot_device_heartbeats_received_total[5m]) == 0
        and on() iot_devices_active_count > 0
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "No IoT heartbeats received in 5min while fleet is active"
        description: "Possible: gateway down, /api/iot-devices/heartbeat route broken, or full-fleet disconnect."

    - alert: IotSensorOutlierSpike
      expr: |
        (
          sum(rate(sensor_readings_rejected_outlier_total[10m]))
          /
          (sum(rate(sensor_readings_inserted_total[10m]))
           + sum(rate(sensor_readings_rejected_outlier_total[10m])))
        ) > 0.1
      for: 10m
      labels: { severity: warning }
      annotations:
        summary: "Outlier reject rate {{`{{ $value | humanizePercentage }}`}} > 10%"
        description: "Check device calibration profiles or raw BMS reading."

    - alert: IotClockDriftFleetWide
      expr: |
        (
          sum(iot_devices_clock_skew_high_count)
          /
          sum(iot_devices_active_count)
        ) > 0.5
      for: 15m
      labels: { severity: warning }
      annotations:
        summary: "{{`{{ $value | humanizePercentage }}`}} of fleet has clock skew > 60s"
        description: "Likely NTP outage — check pool.ntp.org / time.google.com reachability."

    - alert: IotFirmwareUpdateFailureSpike
      expr: |
        (
          sum(increase(iot_firmware_update_status_total{status="Failed"}[1h]))
          /
          sum(increase(iot_firmware_update_status_total[1h]))
        ) > 0.3
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "Firmware update fail rate {{`{{ $value | humanizePercentage }}`}} in last 1h"
        description: "Consider archiving release via POST /api/admin/iot-firmware-releases/{id}/archive."

  # ---- Sprint IoT-1 #253 — MQTT bridge + broker ----
  - name: iot-mqtt-bridge
    interval: 30s
    rules:
    - alert: MqttBridgeDisconnected
      expr: mqtt_bridge_connected == 0 and on() mqtt_bridge_enabled == 1
      for: 2m
      labels: { severity: critical }
      annotations:
        summary: "MQTT bridge disconnected from broker > 2min"
        description: "Check mosquitto pod, Mqtt__Password, TLS cert, ACL. Bridge auto-reconnects every Mqtt__ReconnectIntervalSeconds."

    - alert: MqttBrokerDown
      expr: up{component="mosquitto"} == 0
      for: 2m
      labels: { severity: warning }
      annotations:
        summary: "Mosquitto MQTT broker not reachable"

    - alert: MqttSubscriberLag
      expr: mqtt_subscriber_queue_depth{topic=~"telemetry/.*"} > 1000
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "MQTT topic {{`{{ $labels.topic }}`}} backlog {{`{{ $value }}`}} messages"
        description: "Bridge dispatch slow → batteryservice ingest bottleneck."

  # ---- Infrastructure ----
  - name: infrastructure
    interval: 30s
    rules:
    - alert: ContainerMemoryHigh
      expr: |
        (container_memory_working_set_bytes{name!=""}
         / container_spec_memory_limit_bytes{name!=""}) > 0.9
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Container {{`{{ $labels.name }}`}} memory > 90%"

    - alert: PostgresConnectionsHigh
      expr: |
        (sum(pg_stat_activity_count) by (instance)
         / sum(pg_settings_max_connections) by (instance)) > 0.8
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Postgres connections > 80% of limit"
{{- end }}
