{{/*
  PrometheusRule CRD — kube-prometheus-stack auto-discover và load.
  Chỉ render khi monitoring.prometheusRules.enabled=true (cần CRD `monitoring.coreos.com/v1`).

  ───────────────────────────────────────────────────────────────────────────────
  Nội dung rule KHÔNG viết ở đây. Nó được nạp nguyên khối từ `files/alert-rules.yml`.

  Trước đây file này chép tay từng rule và đã trôi rất xa bản gốc: 26 alert so với 40 —
  thiếu trọn 3 nhóm `auth-security`, `chat_hub_alerts`, `notification-delivery`. Nghĩa là
  14 cảnh báo chạy bình thường trên docker-compose nhưng chưa bao giờ tồn tại trên K8s,
  và không có gì báo cho ai biết.

  Chép tay còn kéo theo một bẫy nữa: rule của Prometheus dùng chính cú pháp ngoặc nhọn đôi
  (vd $value, $labels.channel), nên khi nhúng vào template Helm phải escape từng chỗ bằng
  backtick. Quên một chỗ là Helm nuốt mất biến — alert vẫn nổ nhưng nội dung rỗng.

  `.Files.Get` đọc file ở dạng thô và Helm KHÔNG render lại chuỗi trả về, nên toàn bộ
  ngoặc nhọn đôi của Prometheus đi thẳng ra output, không cần escape gì.

  ⚠️ `files/alert-rules.yml` phải trùng khít `monitoring/prometheus/alert-rules.yml`
  (bản mà docker-compose mount). Helm chỉ đọc được file NẰM TRONG thư mục chart nên buộc
  phải giữ một bản sao. `ci/scripts/rule-checks.sh` có luật so khớp hai file — CI đỏ nếu lệch.
  Đồng bộ bằng: make sync-alert-rules
  ───────────────────────────────────────────────────────────────────────────────
*/}}
{{- if .Values.monitoring.prometheusRules.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: solar-battery-rules
  labels:
    {{- include "solar.labels" . | nindent 4 }}
    # Label này để kube-prometheus-stack discover (khớp ruleSelector trong chart values)
    release: monitoring
spec:
{{ .Files.Get "files/alert-rules.yml" | indent 2 }}
{{- end }}
