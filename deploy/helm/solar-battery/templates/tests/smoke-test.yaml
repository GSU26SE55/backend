{{- /*
  Sprint 7 #596 — Helm smoke test. Chạy bằng `helm test <release>`.
  Curl readiness endpoint của mọi ASP.NET service (qua in-cluster DNS) — fail nếu service nào không 200.
*/ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke-test
  labels:
    {{- include "solar.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.10.1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          fail=0
          check() {
            url="$1"
            response_file="$(mktemp)"
            error_file="$(mktemp)"
            if code="$(curl --silent --show-error --output "${response_file}" \
              --write-out '%{http_code}' --max-time 10 "${url}" 2>"${error_file}")"; then
              if [ "${code}" = "200" ]; then
                echo "OK   ${url} (${code})"
              else
                echo "FAIL ${url} (HTTP ${code})"
                head -c 512 "${response_file}" || true
                echo
                fail=1
              fi
            else
              curl_status="$?"
              echo "FAIL ${url} (curl exit ${curl_status})"
              head -c 512 "${error_file}" || true
              echo
              fail=1
            fi
            rm -f "${response_file}" "${error_file}"
          }
          echo "== Smoke test: readiness endpoint các service =="
          check http://apigateway:80/health
          check http://authservice:80/health
          check http://batteryservice:80/api/battery/health
          check http://ticketservice:80/api/ticket/health
          check http://notificationservice:80/metrics
          check http://filestorageservice:80/metrics
          check http://smsservice:80/metrics
          {{- if (index .Values "kube-prometheus-stack" "enabled") }}
          check http://{{ .Release.Name }}-grafana:80/api/health
          {{- end }}
          {{- if .Values.tempo.enabled }}
          check http://tempo:3200/ready
          {{- end }}
          echo "== Done (fail=$fail) =="
          exit $fail
