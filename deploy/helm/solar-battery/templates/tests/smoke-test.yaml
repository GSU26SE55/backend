{{- /*
  Sprint 7 #596 — Helm smoke test. Chạy bằng `helm test <release>`.
  Curl readiness endpoint của mọi ASP.NET service (qua in-cluster DNS) — fail nếu service nào không 200.
*/ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke-test
  labels:
    {{- include "solar.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.10.1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      {{- if (index .Values "kube-prometheus-stack" "enabled") }}
      env:
        - name: GRAFANA_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ dig "admin" "existingSecret" "" (index .Values "kube-prometheus-stack" "grafana") | default (printf "%s-grafana" .Release.Name) }}
              key: admin-user
        - name: GRAFANA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ dig "admin" "existingSecret" "" (index .Values "kube-prometheus-stack" "grafana") | default (printf "%s-grafana" .Release.Name) }}
              key: admin-password
      {{- end }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          fail=0
          grafana_failed=0
          check() {
            url="$1"
            response_file="$(mktemp)"
            error_file="$(mktemp)"
            if code="$(curl --silent --show-error --output "${response_file}" \
              --write-out '%{http_code}' --max-time 10 "${url}" 2>"${error_file}")"; then
              if [ "${code}" = "200" ]; then
                echo "OK   ${url} (${code})"
              else
                echo "FAIL ${url} (HTTP ${code})"
                head -c 512 "${response_file}" || true
                echo
                fail=1
              fi
            else
              curl_status="$?"
              echo "FAIL ${url} (curl exit ${curl_status})"
              head -c 512 "${error_file}" || true
              echo
              fail=1
            fi
            rm -f "${response_file}" "${error_file}"
          }
          check_grafana_api() {
            resource_path="$1"
            resource_name="$2"
            if [ "${grafana_failed}" -ne 0 ]; then
              return
            fi
            response_file="$(mktemp)"
            error_file="$(mktemp)"
            attempts=0
            while :; do
              code=""
              curl_status=0
              if code="$(curl --silent --show-error \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --user "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
                --max-time 10 \
                "http://{{ .Release.Name }}-grafana:80${resource_path}" \
                2>"${error_file}")"; then
                :
              else
                curl_status="$?"
              fi

              if [ "${curl_status}" -eq 0 ] && [ "${code}" = "200" ]; then
                echo "OK   Grafana ${resource_name}"
                rm -f "${response_file}" "${error_file}"
                return
              fi

              attempts=$((attempts + 1))
              if [ "${attempts}" -ge 30 ]; then
                if [ "${curl_status}" -eq 0 ]; then
                  echo "FAIL Grafana could not make ${resource_name} available (HTTP ${code})"
                  head -c 512 "${response_file}" || true
                else
                  echo "FAIL Grafana could not make ${resource_name} available (curl exit ${curl_status})"
                  head -c 512 "${error_file}" || true
                fi
                echo
                fail=1
                case "${code}" in
                  401|403|502|503|504) grafana_failed=1 ;;
                esac
                if [ "${curl_status}" -ne 0 ]; then
                  grafana_failed=1
                fi
                rm -f "${response_file}" "${error_file}"
                return
              fi
              sleep 2
            done
          }
          echo "== Smoke test: readiness endpoint các service =="
          check http://apigateway:80/health
          check http://authservice:80/health
          check http://batteryservice:80/api/battery/health
          check http://ticketservice:80/api/ticket/health
          check http://notificationservice:80/metrics
          check http://filestorageservice:80/metrics
          check http://smsservice:80/metrics
          {{- if (index .Values "kube-prometheus-stack" "enabled") }}
          check http://{{ .Release.Name }}-grafana:80/api/health
          # Exercise each real backend API through Grafana's datasource proxy.
          # Generic datasource health handlers are plugin/version-specific:
          # the deployed Loki handler sends PromQL `vector(1)+vector(1)` to
          # LogQL and reports a false 400 failure.
          check_grafana_api "/api/datasources/proxy/uid/prometheus/api/v1/query?query=up" "queried Prometheus API through datasource proxy"
          check_grafana_api "/api/datasources/proxy/uid/alertmanager/api/v2/status" "queried Alertmanager API through datasource proxy"
          {{- if (index .Values "loki-stack" "enabled") }}
          check_grafana_api "/api/datasources/proxy/uid/loki/loki/api/v1/labels" "queried Loki API through datasource proxy"
          {{- end }}
          {{- if .Values.tempo.enabled }}
          check_grafana_api "/api/datasources/proxy/uid/tempo/ready" "queried Tempo readiness through datasource proxy"
          {{- end }}
          {{- if .Values.monitoring.grafanaDashboards.enabled }}
          {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
          {{- $dashboard := $.Files.Get $path | fromJson }}
          check_grafana_api /api/dashboards/uid/{{ $dashboard.uid }} "provisioned dashboard {{ $dashboard.title }}"
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.tempo.enabled }}
          check http://tempo:3200/ready
          {{- end }}
          echo "== Done (fail=$fail) =="
          exit $fail
