# =====================================================================
# values-vps-small.yaml
# Capacity overlay for the 6-vCPU / 12-GB / 80-GB single-node R4. Jenkins runs
# on R3. Keep every service and observability component enabled, while bounding
# memory, persistent storage and retention so local-path volumes cannot reserve
# more disk than the node has. This file must be passed after production values.
# =====================================================================

global:
  imagePullPolicy: IfNotPresent
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

services:
  apigateway:
    replicas: 1
    resources:
      requests: { cpu: 80m, memory: 128Mi }
      limits:   { cpu: 300m, memory: 256Mi }

  authservice:
    replicas: 1
    dataProtectionKeys:
      storage: 256Mi
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 600m, memory: 512Mi }
    autoscaling:
      enabled: false

  emailservice:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }

  smsservice:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }

  filestorageservice:
    replicas: 1
    resources:
      requests: { cpu: 120m, memory: 192Mi }
      limits:   { cpu: 500m, memory: 384Mi }

  batteryservice:
    replicas: 1
    firmwareStorage:
      size: 2Gi
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 600m, memory: 512Mi }
    autoscaling:
      enabled: false

  ticketservice:
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { cpu: 600m, memory: 512Mi }
    autoscaling:
      enabled: false

  notificationservice:
    replicas: 1
    # limit nâng 384Mi → 512Mi (30/07/2026). Service này chạy 7 background worker thường trú
    # (AuditOutboxRelay · Dispatch · Digest · DlqMonitor + ExpoReceiptReconcile · Fallback ·
    # Retention — 3 cái cuối thêm ở Sprint 6.3), nhiều nhất hệ thống. Đo thực tế lúc rảnh:
    # 329 MiB = 86% của 384Mi, mà các đợt tốn nhất (bão alert, gom digest, purge retention)
    # chưa hề xảy ra lúc đo. Chạm limit thì K8s OOMKill pod, mất thông báo đang chờ trong hàng.
    # File này được `-f` SAU CÙNG trong Jenkins deploy nên giá trị ở đây là giá trị thắng.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 400m, memory: 512Mi }

  auditaggregatorservice:           # Sprint audit #AUDIT-13
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 400m, memory: 384Mi }

postgres:
  storage: 8Gi
  backup:
    retentionDays: 7
  maxConnections: 100
  sharedBuffers: 64MB
  connectionPool:
    maximumPoolSize: 10
    minimumPoolSize: 0
  initJob:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 1800
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits:   { cpu: 500m, memory: 768Mi }

redis:
  storage: 1Gi
  resources:
    requests: { cpu: 30m, memory: 64Mi }
    limits:   { cpu: 150m, memory: 128Mi }

rabbitmq:
  storage: 2Gi
  returnPerObjectMetrics: true
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits:   { cpu: 700m, memory: 768Mi }

minio:
  storage: 12Gi
  resources:
    requests: { cpu: 80m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  initJob:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 1800
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }

tempo:
  storage: 2Gi
  retention: 24h

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: 3GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests: { storage: 4Gi }
  grafana:
    persistence:
      size: 1Gi

loki-stack:
  loki:
    persistence:
      size: 4Gi
    config:
      table_manager:
        retention_deletes_enabled: true
        retention_period: 72h

config:
  DOTNET_gcServer: "0"
  DisableHttpsRedirection: "true"

resourceQuota:
  enabled: true
  requestsCpu: "2"
  # Prometheus plus the complete backend/observability stack needs more than
  # 4 GiB of requested memory. Keep this aligned with the recovered R4 quota.
  requestsMemory: "6Gi"
  limitsCpu: "10"
  limitsMemory: "12Gi"
  pvcs: "15"
