repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, chore, docs]

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format --verify-no-changes
        language: system
        files: \.cs$
        pass_filenames: false

      - id: energy-co2-scope-guard
        name: Energy/CO2 scope guard (ADR-017)
        entry: >-
          bash -c 'if grep -rInE "EnergySession|EnergyDailySummary|BatteryCycleLog|SiteEnergySummary|ElectricityRate|CarbonEmissionFactor|CapacityKw|kWh|CO2" services/BatteryService/src shared/src 2>/dev/null | grep -vE "/(bin|obj|Migrations)/"; then echo; echo "ERROR: Energy/CO2 scope creep detected (ADR-017). Remove the tokens above or update ADR-017 if scope changes."; exit 1; fi'
        language: system
        pass_filenames: false
