# =====================================================================
# Prometheus scrape config — Solar Battery Maintenance
# =====================================================================
# Scrape mỗi 15s. ASP.NET services expose /metrics qua prometheus-net.
# Exporters chạy dưới dạng container riêng: postgres, redis, node, cadvisor.
# RabbitMQ + Minio expose metrics built-in.
# =====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker
    cluster: solar-battery

# Alertmanager — gửi alert tới đây khi rule fire.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alert rules.
rule_files:
  - "alert-rules.yml"

scrape_configs:
  # ---------- Self-monitoring ----------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------- ASP.NET Application Services ----------
  - job_name: apigateway
    metrics_path: /metrics
    static_configs:
      - targets: ["apigateway:8080"]
        labels:
          service: apigateway
          tier: gateway

  - job_name: authservice
    metrics_path: /metrics
    static_configs:
      - targets: ["authservice:8080"]
        labels:
          service: authservice
          tier: backend

  - job_name: emailservice
    metrics_path: /metrics
    static_configs:
      - targets: ["emailservice:8080"]
        labels:
          service: emailservice
          tier: backend

  - job_name: smsservice
    metrics_path: /metrics
    static_configs:
      - targets: ["smsservice:8080"]
        labels:
          service: smsservice
          tier: backend

  - job_name: filestorageservice
    metrics_path: /metrics
    static_configs:
      - targets: ["filestorageservice:8080"]
        labels:
          service: filestorageservice
          tier: backend

  - job_name: batteryservice
    metrics_path: /metrics
    static_configs:
      - targets: ["batteryservice:8080"]
        labels:
          service: batteryservice
          tier: backend

  # ---------- Infrastructure exporters ----------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          tier: infrastructure
          component: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: infrastructure
          component: container

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          tier: infrastructure
          component: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          tier: infrastructure
          component: redis

  # ---------- RabbitMQ built-in Prometheus plugin (cần enable trong rabbitmq.conf hoặc dùng image có sẵn) ----------
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          tier: infrastructure
          component: rabbitmq

  # ---------- Minio built-in Prometheus endpoint (public, không cần auth khi MINIO_PROMETHEUS_AUTH_TYPE=public) ----------
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          tier: infrastructure
          component: minio
