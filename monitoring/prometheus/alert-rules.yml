# =====================================================================
# Prometheus Alert Rules — Solar Battery Maintenance
# =====================================================================
# 10 alert rules quan trọng. Severity: critical (page oncall) | warning (slack).
# Mỗi rule có `for: <duration>` để tránh flapping (alert chỉ fire khi điều kiện
# kéo dài qua khoảng thời gian đó).
# =====================================================================

groups:
  # =====================================================================
  # Service availability & error rates
  # =====================================================================
  - name: service-health
    interval: 30s
    rules:
      # 1. Service down — Prometheus không scrape được /metrics qua 1 phút.
      - alert: ServiceDown
        expr: up{tier=~"backend|gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Prometheus failed to scrape {{ $labels.service }} for over 1 minute."

      # 2. High HTTP 5xx error rate — > 5% requests trả 5xx trong 5 phút.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_received_total{code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_received_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate on {{ $labels.service }} ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests are 5xx errors over the last 5 minutes."

      # 3. High HTTP latency — p95 > 1s trong 5 phút.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency on {{ $labels.service }} > 1s (currently {{ $value }}s)"
          description: "Request latency degraded — investigate downstream calls."

  # =====================================================================
  # Messaging & Reliability patterns (Outbox / Inbox / Idempotency-Key)
  # =====================================================================
  - name: messaging-reliability
    interval: 30s
    rules:
      # 4. Outbox backlog — > 100 messages chưa publish kéo dài 5 phút (RabbitMQ down hoặc relay job stuck).
      - alert: OutboxBacklog
        expr: outbox_messages_pending_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog > 100 messages"
          description: "{{ $value }} messages pending publish — RabbitMQ down or relay job stuck."

      # 5. Outbox publish failure spike — > 1 fail/sec (RabbitMQ likely down).
      - alert: OutboxPublishFailures
        expr: rate(outbox_messages_failures_total[5m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox publish failing at {{ $value }} msg/sec"
          description: "Reasons: {{ $labels.reason }}. Likely RabbitMQ outage — check broker status."

      # 6. Poison messages (RetryCount >= MaxRetries) — bất kỳ message nào bị skip → ngó ngay.
      - alert: OutboxPoisonMessages
        expr: increase(outbox_messages_skipped_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Outbox skipped {{ $value }} poison messages"
          description: "Messages reached MaxRetries — manual intervention required."

      # 7. High Inbox duplicate rate — > 50% messages bị skip (consumer retry quá nhiều, có thể bug ack).
      - alert: HighInboxDuplicateRate
        expr: |
          (
            sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer)
            /
            (sum(rate(inbox_messages_processed_total[5m])) by (consumer)
             + sum(rate(inbox_messages_skipped_duplicate_total[5m])) by (consumer))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer {{ $labels.consumer }} duplicate rate > 50%"
          description: "Consumer is retrying too often — check ack logic or downstream errors."

      # 8. Idempotency-Key conflicts spike — client retry parallel quá nhiều (UX issue).
      - alert: IdempotencyConflictSpike
        expr: rate(idempotency_key_conflicts_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Idempotency conflicts at {{ $value }}/sec"
          description: "Client may be sending parallel duplicate requests with same key."

  # =====================================================================
  # Alert–Ticket Saga (Sprint 5B #239 — overall.md §9.2)
  # =====================================================================
  - name: alert-ticket-saga
    interval: 30s
    rules:
      # 11. Saga failure rate spike — > 5 failures trong 5 phút (SEV2 page).
      # NotificationService AlertTicketSagaFailedConsumer cũng fire email/push parallel.
      - alert: SagaFailedRateSpike
        expr: increase(saga_alert_ticket_failed_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alert-Ticket Saga failures {{ $value }} in 5m"
          description: "Reason: {{ $labels.reason }}. Runbook: docs/runbooks/08-saga-failed.md"

      # 12. Saga stuck — > 50 in-flight sagas (TicketRequested/AlertLinkRequested) > 15 phút.
      # Khả năng: Quartz timer mất hoặc consumer DI crash giữa pipeline.
      - alert: SagaStuck
        expr: saga_alert_ticket_active_count > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Saga active count {{ $value }} over 15min"
          description: "Quartz timer drift hoặc consumer crash. Runbook: docs/runbooks/09-saga-stuck.md"

  # =====================================================================
  # Sprint IoT-1 — IoT edge device fleet (§52, #248)
  # =====================================================================
  - name: iot-device-fleet
    interval: 30s
    rules:
      # 13. IoT device offline spike — > 3 device chuyển sang Offline trong 5 phút.
      # Có thể: WiFi outage tại 1 site, broker MQTT down, NTP server lost,
      # firmware mới gây crash, hoặc backend overload từ chối heartbeat.
      - alert: IotDeviceOfflineSpike
        expr: increase(iot_devices_marked_offline_total[5m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} IoT device(s) chuyển sang Offline trong 5 phút"
          description: "Kiểm tra: WiFi/network tại site, MQTT broker status, batteryservice heartbeat handler."

      # 14. IoT heartbeat ingestion stall — không nhận heartbeat nào > 5 phút khi fleet active.
      # Tránh fire khi chưa deploy device (predicate `iot_devices_active_count > 0`).
      - alert: IotHeartbeatStall
        expr: |
          rate(iot_device_heartbeats_received_total[5m]) == 0
          and on() iot_devices_active_count > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Không nhận heartbeat IoT > 5 phút (fleet đang active {{ $value }} device)"
          description: "Có thể: gateway down, route /api/iot-devices/heartbeat lỗi, hoặc fleet mất kết nối toàn bộ."

      # 15. Sensor outlier reject rate spike — > 10% reading bị loại trong 10 phút.
      # Khả năng: BMS lỗi sensor, calibration sai (Scale/Offset), noise hardware nặng.
      - alert: IotSensorOutlierSpike
        expr: |
          (
            sum(rate(sensor_readings_rejected_outlier_total[10m]))
            /
            (sum(rate(sensor_readings_inserted_total[10m]))
             + sum(rate(sensor_readings_rejected_outlier_total[10m])))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outlier reject rate {{ $value | humanizePercentage }} > 10%"
          description: "Kiểm tra calibration profile (iot_device_calibrations) hoặc raw BMS reading."

      # 16. Clock drift fleet-wide — > 50% device có skew > 60s.
      # NTP outage thường gây drift đồng loạt cả fleet.
      - alert: IotClockDriftFleetWide
        expr: |
          (
            sum(iot_devices_clock_skew_high_count)
            /
            sum(iot_devices_active_count)
          ) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} fleet bị clock drift > 60s"
          description: "Kiểm tra NTP server (pool.ntp.org / time.google.com) — drift đồng loạt thường do NTP outage."

      # 17. Firmware update failure rate — > 30% attempt trả Failed trong 1 giờ.
      # Bản firmware mới có thể có bug.
      - alert: IotFirmwareUpdateFailureSpike
        expr: |
          (
            sum(increase(iot_firmware_update_status_total{status="Failed"}[1h]))
            /
            sum(increase(iot_firmware_update_status_total[1h]))
          ) > 0.3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Firmware update fail rate {{ $value | humanizePercentage }} trong 1h"
          description: "Cân nhắc archive bản qua POST /api/admin/iot-firmware-releases/{id}/archive."

  # =====================================================================
  # Sprint IoT-1 #253 — MQTT bridge + broker (P3 optional)
  # Chỉ fire khi Mqtt__Enabled=true. Bridge tự log + idle nếu disabled.
  # =====================================================================
  - name: iot-mqtt-bridge
    interval: 30s
    rules:
      # 18. MQTT bridge disconnected — > 2 phút mất kết nối broker.
      - alert: MqttBridgeDisconnected
        expr: mqtt_bridge_connected == 0 and on() mqtt_bridge_enabled == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MQTT bridge mất kết nối tới broker > 2 phút"
          description: "Kiểm tra: container solar-mosquitto, Mqtt__Password, cert TLS, ACL config. Bridge tự reconnect mỗi Mqtt__ReconnectIntervalSeconds (default 5s)."

      # 19. Mosquitto broker down.
      - alert: MqttBrokerDown
        expr: up{component="mosquitto"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Mosquitto MQTT broker không reachable"
          description: "Container solar-mosquitto có thể đã crash. Check `docker logs solar-mosquitto`."

      # 20. MQTT subscriber lag — backlog topic telemetry > 1000.
      - alert: MqttSubscriberLag
        expr: mqtt_subscriber_queue_depth{topic=~"telemetry/.*"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MQTT topic {{ $labels.topic }} backlog {{ $value }} messages"
          description: "Bridge dispatch chậm → batteryservice ingest handler nghẽn. Tăng MessageBus__PrefetchCount hoặc scale batteryservice."

  # =====================================================================
  # Infrastructure
  # =====================================================================
  - name: infrastructure
    interval: 30s
    rules:
      # 9. Container memory usage > 90% limit — sắp OOM.
      - alert: ContainerMemoryHigh
        expr: |
          (container_memory_working_set_bytes{name!=""}
           / container_spec_memory_limit_bytes{name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 90%"
          description: "Container approaching OOM — consider raising limits or investigating leak."

      # 10. Postgres connections high — > 80% of max_connections.
      - alert: PostgresConnectionsHigh
        expr: |
          (sum(pg_stat_activity_count) by (instance)
           / sum(pg_settings_max_connections) by (instance)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections at {{ $value | humanizePercentage }} of limit"
          description: "Connection pool exhaustion risk — check for connection leaks."
