# Auto-load dashboards từ /var/lib/grafana/dashboards (volume mount).
# Mọi file *.json trong path này được Grafana load + refresh mỗi 30s.

apiVersion: 1

providers:
  - name: "Solar Battery Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
