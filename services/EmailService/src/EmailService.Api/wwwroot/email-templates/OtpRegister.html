<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Verify your account</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;">
    <div style="font-family: Helvetica, Arial, sans-serif; min-width:1000px; overflow:auto; line-height:2">
        <div style="margin:50px auto; width:70%; padding:20px 0; background:#ffffff;">
            <div style="border-bottom:1px solid #eee">
                <a href="#" style="font-size:1.4em; color:#00466a; text-decoration:none; font-weight:600">{{AppName}}</a>
            </div>
            <p style="font-size:1.1em">Xin chào {{UserName}},</p>
            <p>Cảm ơn bạn đã đăng ký. Sử dụng mã OTP sau để hoàn tất quá trình đăng ký. Mã có hiệu lực trong {{ExpireMinutes}} phút.</p>
            <h2 style="background:#00466a; margin:0 auto; width:max-content; padding:0 10px; color:#fff; border-radius:4px;">{{Otp}}</h2>
            <p style="font-size:0.9em;">Xin cảm ơn,<br />{{AppName}} Team</p>
            <hr style="border:none;border-top:1px solid #eee" />
        </div>
    </div>
</body>
</html>
