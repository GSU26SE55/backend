# =====================================================================
# Solar Battery Maintenance — Docker Compose stack
# =====================================================================
# Khởi động:
#   1. Copy template env và fill secret:
#        cp .env.Docker.example .env.Docker
#   2. docker compose --env-file .env.Docker up -d --build
#
# Truy cập:
#   - ApiGateway:        http://localhost:4001
#   - BatteryService:    http://localhost:4006
#   - RabbitMQ UI:       http://localhost:15673  (guest/guest)
#   - Minio Console:     http://localhost:9091   (minioadmin/minioadmin)
#   - Postgres:          localhost:5433          (psql)
#
# Note: HTTP-only cho dev. Production đặt nginx/Caddy/Traefik phía trước
# để terminate TLS với cert real.
# =====================================================================

networks:
  solar-net:
    driver: bridge

volumes:
  # F4 — phản hồi phân loại của Staff, dữ liệu để retrain model anomaly.
  # BẮT BUỘC là volume, vì hai lý do độc lập:
  #   1. gRPC và HTTP là HAI container riêng ⇒ mỗi cái ghi một file trong lớp ghi của
  #      chính nó, thống kê precision/recall sẽ khác nhau tuỳ hỏi transport nào.
  #   2. Không có volume thì `docker compose build` là xoá sạch dữ liệu retrain —
  #      đúng thứ duy nhất mà F4 sinh ra để giữ lại.
  ai-classification-feedback:
  # Lịch sử prescription (ChromaDB) — giữ prescription_id và các ca đã được kỹ thuật viên
  # chấp nhận (dùng làm few-shot cho ca tương tự sau).
  # BẮT BUỘC dùng chung, cùng hai lý do như store phản hồi phân loại, nhưng hậu quả nặng hơn:
  #   1. BE fallback gRPC→HTTP giữa lúc kê đơn và lúc gửi phản hồi là chuyện BÌNH THƯỜNG.
  #      Store tách đôi ⇒ prescription kê ở container này, phản hồi hỏi container kia ⇒ 410,
  #      phản hồi của kỹ thuật viên mất trắng mà UI vẫn báo thành công.
  #   2. Nửa số ca "accepted" vô hình với nửa còn lại ⇒ few-shot học trên nửa dữ liệu.
  ai-prescription-history:
  postgres-data:
  mosquitto-data:   # Sprint IoT-1 #253 — chỉ dùng khi bật profile `mqtt`
  mosquitto-log:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  tempo-data:        # Sprint 7 #116 — Tempo trace storage.
  # Sprint IoT-2 #IoT2-35 — firmware .bin upload persistence.
  firmware-storage:
  # GH-295 — ASP.NET Data Protection keys cho 2FA TwoFactorSecret encryption.
  auth-dataprotection-keys:

services:
  # ---------- Infrastructure ----------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: solar-postgres
    env_file:
      - .env.Docker
    environment:
      # Database quản trị để Postgres khởi tạo container.
      # Database riêng của từng service được tạo bởi postgres-init bên dưới.
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Password12345@}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [solar-net]

  # Tạo logical database riêng cho từng service.
  # Chạy idempotent sau khi Postgres healthy, nên hoạt động cả với volume đã tồn tại.
  postgres-init:
    image: postgres:16-alpine
    container_name: solar-postgres-init
    env_file:
      - .env.Docker
    environment:
      POSTGRES_HOST: postgres
      # Container-to-container traffic uses the Postgres container port.
      # The host mapping above keeps Docker Postgres reachable from macOS at localhost:5433.
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Password12345@}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      FILE_STORAGE_DB_NAME: ${FILE_STORAGE_DB_NAME:-file_storage_db}
      BATTERY_DB_NAME: ${BATTERY_DB_NAME:-battery_db}
      TICKET_DB_NAME: ${TICKET_DB_NAME:-ticket_db}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      SMS_DB_NAME: ${SMS_DB_NAME:-sms_db}
      # Sprint audit #AUDIT-13/14 — read-store AuditAggregatorService (logical DB chung postgres).
      AUDIT_AGGREGATOR_DB_NAME: ${AUDIT_AGGREGATOR_DB_NAME:-audit_aggregator_db}
    volumes:
      - ./docker/postgres/create-service-databases.sh:/scripts/create-service-databases.sh:ro
    command: ["/bin/sh", "/scripts/create-service-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [solar-net]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: solar-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [solar-net]

  # ==================================================================
  # Sprint IoT-1 #253 — MQTT broker cho bridge của BatteryService.
  #
  # ĐẶT SAU PROFILE `mqtt` nên KHÔNG chạy mặc định (`docker compose up` bỏ qua service này) —
  # đúng yêu cầu "chỉ bật khi triển khai MQTT" (§51). Bật bằng:
  #     docker compose --profile mqtt up -d mosquitto
  #
  # Trước 31/07/2026 compose KHÔNG có service này, trong khi batteryservice đã trỏ sẵn
  # `Mqtt__Host=mosquitto` ⇒ đặt `Mqtt__Enabled=true` là bridge treo ở trạng thái reconnect vô hạn
  # vì không có host nào tên `mosquitto` trên `solar-net`.
  #
  # Chuẩn bị trước lần chạy đầu (xem infra/mqtt/README.md):
  #   ./infra/mqtt/mosquitto/bootstrap.sh          # sinh passwd → paste vào .env.Docker
  #   ./infra/mqtt/scripts/gen-certs.sh mosquitto  # (tuỳ chọn) bật TLS 8883
  # ==================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: solar-mosquitto
    profiles: ["mqtt"]
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-21883}:1883"      # plain MQTT
      - "${MQTT_HOST_TLS_PORT:-28883}:8883"  # TLS — chỉ có listener sau khi chạy gen-certs.sh
    volumes:
      - ./infra/mqtt/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mqtt/mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      # conf.d rỗng khi chưa sinh cert → broker chạy với 1883, KHÔNG fail to start.
      - ./infra/mqtt/mosquitto/config/conf.d:/mosquitto/config/conf.d:ro
      # IOT3-106/M1 — mount THƯ MỤC, không phải file lẻ.
      # Backend ghi passwd bằng `File.Move` (đổi inode); bind mount file lẻ không truyền đủ thay
      # đổi đó vào container ⇒ `passwd-watch` không thấy mtime đổi ⇒ không SIGHUP ⇒ thiết bị mới
      # bị từ chối trong im lặng. `password_file` trong mosquitto.conf trỏ vào đường này.
      - ./infra/mqtt/mosquitto:/mosquitto/config-src:ro
      - ./infra/mqtt/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    # GH-784 — broker TỰ nạp lại khi file passwd đổi.
    #
    # Mosquitto 2.0 chỉ đọc lại `password_file` khi nhận SIGHUP. Cách khác là để BatteryService gọi
    # Docker API mà bắn tín hiệu sang đây — nhưng như vậy phải cấp Docker socket cho một container
    # ứng dụng, tức trao quyền điều khiển toàn máy chủ chỉ để bảo broker đọc lại một file.
    # Ở đây broker tự theo dõi file của chính nó: không container nào cần thêm đặc quyền.
    #
    # Dùng vòng lặp so mốc sửa đổi thay vì inotify vì image mosquitto:2.0 không có inotify-tools;
    # 5 giây là đủ nhanh cho việc cấp/thu hồi thiết bị.
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          last=""
          while :; do
            cur=$$(stat -c %Y /mosquitto/config-src/passwd 2>/dev/null || echo none)
            if [ -n "$$last" ] && [ "$$cur" != "$$last" ]; then
              echo "[passwd-watch] file doi -> SIGHUP mosquitto"
              kill -HUP 1 2>/dev/null || true
            fi
            last="$$cur"
            sleep 5
          done
        ) &
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      # GH-786 — credential cho healthcheck. Dùng lại tài khoản bridge: ACL đã cho nó
      # `readwrite solar/#`, nên không phải sinh thêm user chỉ để thăm dò.
      MQTT_HEALTH_USER: ${Mqtt__Username:-backend-bridge}
      MQTT_HEALTH_PASS: ${Mqtt__Password:-}
    healthcheck:
      # GH-786 — thăm dò bằng PUBLISH CÓ XÁC THỰC, không phải mở socket.
      #
      # Bản cũ dùng `sh -c '</dev/tcp/127.0.0.1/1883'` kèm chú thích "nc không có trong image".
      # Nhưng `/dev/tcp` là tính năng của BASH, còn image mosquitto:2.0 dùng BusyBox ash — kiểm
      # chứng trực tiếp: `sh: can't open /dev/tcp/127.0.0.1/1883: no such file`. Nên healthcheck
      # LUÔN thất bại và container vĩnh viễn `unhealthy`, kể cả khi broker đang phục vụ bình thường.
      #
      # `mosquitto_pub` CÓ trong image (/usr/bin/mosquitto_pub). Publish QoS 1 buộc broker phải ACK,
      # nên phép thử này phủ cả listener LẪN đường xác thực — mở được socket mà auth hỏng thì vẫn
      # phải báo unhealthy, đó mới là "thật sự dùng được".
      #
      # Không đặt cờ timeout của mosquitto_pub: nó không có `-W`; `timeout:` của Docker lo việc đó.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$$MQTT_HEALTH_USER\" -P \"$$MQTT_HEALTH_PASS\" -t solar/healthcheck -m ok -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [solar-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: solar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # Enable Prometheus plugin (port 15692) + management plugin để Prometheus scrape /metrics.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus return_per_object_metrics true"
    ports:
      - "5673:5672"      # AMQP
      - "15673:15672"    # Management UI
      - "15692:15692"    # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # Enable plugins on startup (rabbitmq_prometheus + rabbitmq_management).
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus rabbitmq_management &&
               rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [solar-net]

  minio:
    image: minio/minio:latest
    container_name: solar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MINIO_SERVER_URL = URL public mà browser truy cập → presigned URL Host header validate đúng.
      MINIO_SERVER_URL: http://localhost:9090
      # Cho Prometheus scrape /minio/v2/metrics/cluster không cần auth (dev only).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9090:9000"      # S3 API
      - "9091:9001"      # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [solar-net]

  # Init container — tạo bucket + set anonymous read policy 1 lần sau khi minio healthy.
  # Sau đó URL http://localhost:9090/solar-battery-files/<objectKey> truy cập trực tiếp được trên browser.
  minio-init:
    image: minio/mc:latest
    container_name: solar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/solar-battery-files 2>/dev/null || true &&
      mc anonymous set download local/solar-battery-files &&
      echo 'Bucket public read policy applied' &&
      exit 0
      "
    networks: [solar-net]
    restart: "no"

  # ---------- Application Services ----------
  authservice:
    container_name: solar-authservice
    build:
      context: .
      dockerfile: services/AuthService/src/AuthService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # AuthService chỉ dùng database riêng của Auth.
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=${AUTH_DB_NAME:-auth_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      # Data Protection keys cho 2FA secret encryption (GH-295). Volume bên dưới mount /app/keys persist cross-restart.
      DataProtection__KeysPath: "/app/keys"
    ports:
      - "4002:8080"
    volumes:
      - auth-dataprotection-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  emailservice:
    container_name: solar-emailservice
    build:
      context: .
      dockerfile: services/EmailService/src/EmailService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "4003:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  smsservice:
    container_name: solar-smsservice
    build:
      context: .
      dockerfile: services/SmsService/src/SmsService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # Sprint SMS — SMS Gateway Hub (sms_db owner).
      ConnectionStrings__SmsDb: "Host=postgres;Port=5432;Database=${SMS_DB_NAME:-sms_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
    ports:
      - "4004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  filestorageservice:
    container_name: solar-filestorageservice
    build:
      context: .
      dockerfile: services/FileStorageService/src/FileStorageService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # FileStorageService gRPC server consumed internally by TicketService voice transcription.
      Grpc__Port: ${FILE_STORAGE_SERVICE_GRPC_SERVER_PORT:?FILE_STORAGE_SERVICE_GRPC_SERVER_PORT is required}
      # HARDCODE — match minio container credentials. KHÔNG đọc từ .env.Docker để tránh mismatch.
      ObjectStorage__ServiceUrl: http://minio:9000              # internal API calls (filestorage container → minio)
      ObjectStorage__PublicServiceUrl: http://localhost:9090    # presigned URL signed cho browser
      ObjectStorage__PublicBaseUrl: http://localhost:9090/solar-battery-files  # direct public URL trả về sau upload
      ObjectStorage__AccessKey: minioadmin
      ObjectStorage__SecretKey: minioadmin
      # FileStorageService chỉ dùng database riêng của FileStorage.
      ConnectionStrings__FileStorageDb: "Host=postgres;Port=5432;Database=${FILE_STORAGE_DB_NAME:-file_storage_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      # Sprint audit #AUDIT-29 — thêm Redis (leader election) + RabbitMQ (MassTransit audit relay).
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "4005:8080"
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  # ---------- AI Module (GSU26SE55) — hybrid serving, 2 container ----------
  # Same image, 2 transports (BE gọi gRPC primary → fallback HTTP). ai-module nằm
  # NGOÀI backend repo (../ai-module) — context trỏ ra ngoài. Model artifacts
  # (soh_mamba_v1.6.pth, scaler.pkl, ...) đã commit trong repo ai-module.
  # KHÔNG expose 50051 ra host — chỉ nội bộ solar-net (insecure, no TLS).
  ai-module-grpc:
    container_name: solar-ai-module-grpc
    build:
      context: ../ai-module
      dockerfile: Dockerfile
    command: ["python", "-m", "src.grpc_server"]
    environment:
      GRPC_PORT: "50051"
      # LLM keys optional — chỉ cần cho /prescribe enrich=true. Thiếu → rule-based fallback.
      DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
    expose:
      - "50051"
    volumes:
      # Dùng CHUNG với ai-module-http: hai transport phải ghi vào một store, nếu không
      # precision/recall khác nhau tuỳ hỏi bên nào.
      - ai-classification-feedback:/app/models/classification_feedback
      - ai-prescription-history:/app/models/prescription_history
    networks: [solar-net]
    restart: unless-stopped

  ai-module-http:
    container_name: solar-ai-module-http
    build:
      context: ../ai-module
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
    ports:
      - "4015:8000"   # expose HTTP fallback ra host cho debug/Swagger (:4015/docs)
    volumes:
      # Dùng CHUNG với ai-module-grpc: hai transport phải ghi vào một store, nếu không
      # precision/recall khác nhau tuỳ hỏi bên nào.
      - ai-classification-feedback:/app/models/classification_feedback
      - ai-prescription-history:/app/models/prescription_history
    # Dùng python chứ KHÔNG phải curl: image base là python:3.11-slim, Dockerfile chỉ
    # `pip install`, không hề `apt-get install curl` — healthcheck bằng curl sẽ luôn đỏ.
    # start_period rộng vì lúc boot AI nạp torch + tối đa 8 bộ artifact.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [solar-net]
    restart: unless-stopped

  batteryservice:
    container_name: solar-batteryservice
    build:
      context: .
      dockerfile: services/BatteryService/src/BatteryService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BatteryDb: "Host=postgres;Port=5432;Database=${BATTERY_DB_NAME:-battery_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      ApiKeys__SensorIngest: ${BATTERY_SENSOR_INGEST_API_KEY:-dev-battery-ingest-key}
      AnomalyEngine__ScanIntervalSeconds: ${BATTERY_ANOMALY_SCAN_INTERVAL_SECONDS:-10}   # IOT3-80 — 30→10 s
      AnomalyEngine__DedupWindowMinutes: ${BATTERY_ANOMALY_DEDUP_WINDOW_MINUTES:-30}
      AnomalyEngine__OfflineThresholdMinutes: ${BATTERY_ANOMALY_OFFLINE_THRESHOLD_MINUTES:-10}
      AnomalyEngine__EscalationAfterMinutes: ${BATTERY_ANOMALY_ESCALATION_AFTER_MINUTES:-5}
      AnomalyEngine__EscalationIntervalSeconds: ${BATTERY_ANOMALY_ESCALATION_INTERVAL_SECONDS:-60}
      AnomalyEngine__OutboxRelayIntervalSeconds: ${BATTERY_ANOMALY_OUTBOX_RELAY_INTERVAL_SECONDS:-5}
      AnomalyEngine__OutboxRelayBatchSize: ${BATTERY_ANOMALY_OUTBOX_RELAY_BATCH_SIZE:-100}
      # Sprint 5B #91/#102 — Environmental ingest API key (smoke/fire/water IoT)
      ApiKeys__EnvironmentalIngest: ${BATTERY_ENVIRONMENTAL_INGEST_API_KEY:-dev-battery-environmental-key}
      # Sprint 5B #90/#92 — OpenMeteo + WeatherSyncBackgroundService
      Weather__BaseUrl: ${BATTERY_WEATHER_BASE_URL:-https://api.open-meteo.com/}
      Weather__IntervalMinutes: ${BATTERY_WEATHER_INTERVAL_MINUTES:-15}
      Weather__DedupWindowMinutes: ${BATTERY_WEATHER_DEDUP_WINDOW_MINUTES:-10}
      Weather__HttpTimeoutSeconds: ${BATTERY_WEATHER_HTTP_TIMEOUT_SECONDS:-10}
      Weather__Enabled: ${BATTERY_WEATHER_ENABLED:-true}
      # Sprint 5B #235 — MassTransit endpoint runtime (PrefetchCount / ConcurrentMessageLimit)
      MessageBus__PrefetchCount: ${MESSAGE_BUS_PREFETCH_COUNT:-16}
      MessageBus__ConcurrentMessageLimit: ${MESSAGE_BUS_CONCURRENT_LIMIT:-8}
      # Sprint IoT-1 #248 — IotDeviceOfflineDetectionBackgroundService
      Iot__OfflineCheckIntervalSeconds: ${Iot__OfflineCheckIntervalSeconds:-120}
      Iot__OfflineAfterSeconds: ${Iot__OfflineAfterSeconds:-300}
      Iot__OfflineBatchSize: ${Iot__OfflineBatchSize:-100}
      # Sprint IoT-2 #IoT2-22..26 — MQTT bridge. DEV: listener 1883 plaintext.
      # Bật: Mqtt__Enabled=true sau khi mosquitto container up + đã sinh passwd cho user backend-bridge.
      Mqtt__Enabled: ${Mqtt__Enabled:-false}
      # Internal broker address for the BatteryService container.
      Mqtt__Host: ${Mqtt__Host:-mosquitto}
      Mqtt__Port: ${Mqtt__Port:-1883}
      # Stable address returned to ESP32 devices. It must be reachable from the
      # customer LAN; never expose the Docker-only name "mosquitto" here.
      Mqtt__PublicHost: ${Mqtt__PublicHost:-}
      Mqtt__PublicPort: ${Mqtt__PublicPort:-}
      Mqtt__UseTls: ${Mqtt__UseTls:-false}
      Mqtt__AllowUntrustedCertificates: ${Mqtt__AllowUntrustedCertificates:-true}
      Mqtt__Username: ${Mqtt__Username:-backend-bridge}
      Mqtt__Password: ${Mqtt__Password:-CHANGE_ME}
      Mqtt__ClientId: ${Mqtt__ClientId:-battery-service-bridge}
      Mqtt__ReconnectIntervalSeconds: ${Mqtt__ReconnectIntervalSeconds:-5}
      Mqtt__LwtOfflineGraceSeconds: ${Mqtt__LwtOfflineGraceSeconds:-90}
      # GH-784 — nơi ghi thông tin đăng nhập thiết bị để broker biết chúng tồn tại. Bỏ trống ⇒
      # KHÔNG đồng bộ, và thiết bị vừa cấp sẽ nhận "not authorised" dù API trả 201.
      Mqtt__PasswordFilePath: ${Mqtt__PasswordFilePath:-/mosquitto-config/passwd}
      Mqtt__CredentialSyncIntervalSeconds: ${Mqtt__CredentialSyncIntervalSeconds:-60}
      # Sprint IoT-2 #IoT2-35 — Firmware OTA artifact storage (multipart upload).
      Firmware__StorageRoot: ${Firmware__StorageRoot:-/data/firmware-storage}
      Firmware__PublicBaseUrl: ${Firmware__PublicBaseUrl:-}
      # BE-AI — SohPredictionBackgroundService gọi AI (gRPC primary → HTTP fallback).
      # Ai__Enabled=false → job no-op hoàn toàn (threshold rule vẫn chạy).
      Ai__Enabled: ${AI_ENABLED:-true}
      Ai__GrpcAddress: ${AI_GRPC_ADDRESS:-http://ai-module-grpc:50051}
      Ai__HttpBaseUrl: ${AI_HTTP_BASE_URL:-http://ai-module-http:8000}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-5}
      Ai__IntervalMinutes: ${AI_INTERVAL_MINUTES:-5}
      Ai__MinReadings: ${AI_MIN_READINGS:-30}
      Ai__PrescriptionEnabled: ${AI_PRESCRIPTION_ENABLED:-true}
      # GH-verify-sensor-grpc — gRPC server nội bộ (BatteryInternal.GetSensorSnapshot).
      # Listener HTTP/2 riêng, chỉ trong solar-net (KHÔNG map ra host, KHÔNG JWT).
      Grpc__Port: ${BATTERY_GRPC_PORT:-8081}
    ports:
      - "4006:8080"
    expose:
      - "8081"
    volumes:
      - firmware-storage:/data/firmware-storage
      # GH-784 — mount READ-WRITE đúng MỘT thư mục chứa file passwd, không phải cả infra/mqtt.
      # Mosquitto vẫn mount file đó read-only ở phía nó: chỉ một bên được ghi, và bên ghi là bên
      # sở hữu dữ liệu (DB thiết bị).
      - ./infra/mqtt/mosquitto:/mosquitto-config:rw
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-module-grpc:
        condition: service_started
      # HTTP có healthcheck thật (gRPC thì không: image không có grpc_health_probe và AI
      # không implement grpc.health.v1). Hai container dùng CHUNG image và cùng gọi
      # load_models(), nên HTTP xanh là bằng chứng đủ tốt rằng artifact nạp được.
      ai-module-http:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  # ---------- MQTT broker — KHÔNG nằm trong backend repo ----------
  # Per tasksprint.md S0-INF-02 + architectural decision: broker thuộc IoT monorepo (capstone/iot/),
  # backend chỉ chạy MQTT CLIENT (MqttBridgeBackgroundService) connect tới broker đó.
  #
  # Để test MQTT path từ backend dev:
  #   1. Clone capstone/iot, chạy: docker compose -f iot/infra/docker-compose.dev.yml up -d mosquitto
  #   2. Backend connect qua hostname:
  #        - Nếu iot compose join cùng `solar-net`: Mqtt__Host=mosquitto
  #        - Nếu iot compose mạng riêng: Mqtt__Host=host.docker.internal, Mqtt__Port=1883
  #   3. Set Mqtt__Enabled=true trong .env.Docker
  #
  # Production: docker-compose.prod.yml HOST mosquitto service (single-VPS deploy).

  ticketservice:
    container_name: solar-ticketservice
    build:
      context: .
      dockerfile: services/TicketService/src/TicketService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # TicketService gRPC client target; source variable names both services explicitly.
      Chat__Voice__FileStorageGrpcAddress: ${FILE_STORAGE_GRPC_CLIENT_ADDRESS:?FILE_STORAGE_GRPC_CLIENT_ADDRESS is required}
      ConnectionStrings__TicketDb: "Host=postgres;Port=5432;Database=${TICKET_DB_NAME:-ticket_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      # Sprint 5B #235 — MassTransit endpoint runtime
      MessageBus__PrefetchCount: ${MESSAGE_BUS_PREFETCH_COUNT:-16}
      MessageBus__ConcurrentMessageLimit: ${MESSAGE_BUS_CONCURRENT_LIMIT:-8}
      # Sprint 5B #238 — Alert-Ticket Saga feature flags (cutover)
      AlertTicketSaga__AlertTicketDispatchEnabled: ${ALERT_TICKET_DISPATCH_ENABLED:-true}
      AlertTicketSaga__AlertTicketSagaEnabled: ${ALERT_TICKET_SAGA_ENABLED:-true}
      # AI features — config loaded directly from .env.Docker via env_file (no substitution needed)
      # GH-ticket-verify — battery serial lookup (HTTP) + AI verify ticket (gRPC).
      # TicketAi__Enabled=false → consumer set Skipped (ticket vẫn tạo bình thường).
      TicketAi__Enabled: ${TICKET_AI_ENABLED:-true}
      TicketAi__BatteryServiceBaseUrl: ${TICKET_AI_BATTERY_BASE_URL:-http://batteryservice:8080}
      TicketAi__AiGrpcAddress: ${TICKET_AI_GRPC_ADDRESS:-http://ai-module-grpc:50051}
      # GH-verify-sensor-grpc — gRPC tới BatteryService (đọc sensor pin verify). Nội bộ, không JWT.
      TicketAi__BatteryGrpcAddress: ${TICKET_AI_BATTERY_GRPC_ADDRESS:-http://batteryservice:8081}
      TicketAi__TimeoutSeconds: ${TICKET_AI_TIMEOUT_SECONDS:-5}
      TicketAi__MaxDuplicateCandidates: ${TICKET_AI_MAX_DUPLICATE_CANDIDATES:-10}
      # Chặng 1/2 của độ trễ notification: chat ghi outbox → relay poll → RabbitMQ.
      # Mỗi giây poll ở đây cộng thẳng vào thời gian tin nhắn hiện trên máy người nhận.
      Outbox__IntervalSeconds: ${TICKET_OUTBOX_INTERVAL_SECONDS:-1}
      Outbox__BatchSize: ${TICKET_OUTBOX_BATCH_SIZE:-100}
    ports:
      - "4007:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-module-grpc:
        condition: service_started
      # GH-verify-sensor-grpc — verify consumer gọi gRPC batteryservice đọc sensor.
      batteryservice:
        condition: service_started
    networks: [solar-net]
    restart: unless-stopped

  notificationservice:
    container_name: solar-notificationservice
    build:
      context: .
      dockerfile: services/NotificationService/src/NotificationService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationDb: "Host=postgres;Port=5432;Database=${NOTIFICATION_DB_NAME:-notification_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      # Chặng 2/2 của độ trễ notification: consumer ghi row Pending → dispatch poll → SignalR.
      # Cùng với Outbox__IntervalSeconds bên TicketService, hai vòng poll này là toàn bộ độ trễ
      # cảm nhận được; bản thân SignalR đẩy tới máy tức thì.
      Notification__Dispatch__PollIntervalSeconds: ${NOTIFICATION_DISPATCH_POLL_INTERVAL_SECONDS:-1}
      Notification__Dispatch__BatchSize: ${NOTIFICATION_DISPATCH_BATCH_SIZE:-100}
      # ADR-0019 — đường vận chuyển push. Hai giá trị dưới chỉ là MẶC ĐỊNH cho lần chạy đầu khi
      # bảng notification_settings còn trống; sau khi Admin đổi qua
      # PUT /api/admin/notification-settings/push-transport thì database là nguồn sự thật và biến
      # môi trường này không còn ảnh hưởng (nếu không, mỗi lần restart sẽ ghi đè lựa chọn đó).
      # SignalR | Expo | Both
      Notification__Push__DefaultTransport: ${NOTIFICATION_PUSH_DEFAULT_TRANSPORT:-SignalR}
      Notification__Push__CacheSeconds: ${NOTIFICATION_PUSH_CACHE_SECONDS:-30}
    ports:
      - "4008:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  # Sprint audit #AUDIT-13 — AuditAggregatorService: consume AuditCreatedEventV1 → read-store audit_aggregate.
  auditaggregatorservice:
    container_name: solar-auditaggregatorservice
    build:
      context: .
      dockerfile: services/AuditAggregatorService/src/AuditAggregatorService.Api/Dockerfile
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # Logical DB audit_aggregate trong postgres CHUNG (tạo bởi postgres-init). KHÔNG dùng container DB riêng.
      ConnectionStrings__AuditAggregatorDb: "Host=postgres;Port=5432;Database=${AUDIT_AGGREGATOR_DB_NAME:-audit_aggregator_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Password12345@}"
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "4010:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  # ---------- Gateway (HTTP only — production dùng reverse proxy ngoài cho HTTPS) ----------
  apigateway:
    container_name: solar-apigateway
    build:
      context: .
      dockerfile: services/ApiGateway/src/ApiGateway/Dockerfile
    # Sprint 7 #115 — gateway cần JwtSettings__* để validate JWT (cùng secret với downstream).
    env_file:
      - .env.Docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "4001:8080"
    depends_on:
      - authservice
      - emailservice
      - smsservice
      - filestorageservice
      - batteryservice
      - ticketservice
      - notificationservice
      - auditaggregatorservice   # Sprint audit — gateway route /api/admin/audit/* → auditAggregatorCluster
    networks: [solar-net]
    restart: unless-stopped

  # =====================================================================
  # ---------- Monitoring Stack (Prometheus + Grafana + Exporters) ----------
  # =====================================================================
  # UIs:
  #   - Prometheus:    http://localhost:9094
  #   - Grafana:       http://localhost:3001  (admin/admin)
  #   - Alertmanager:  http://localhost:9095
  # =====================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: solar-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"      # Cho phép curl POST /-/reload reload config không cần restart.
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9094:9090"
    networks: [solar-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: solar-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Single source of truth — dashboards JSON nằm chung với Helm chart cho K8s,
      # docker-compose mount path này luôn để tránh duplicate.
      - ./deploy/helm/solar-battery/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
    networks: [solar-net]
    restart: unless-stopped

  # Sprint 7 #116 — Distributed tracing backend. Service export OTLP về tempo:4317.
  tempo:
    image: grafana/tempo:latest
    container_name: solar-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"      # Tempo query API (Grafana datasource). OTLP 4317 chỉ nội bộ solar-net.
    networks: [solar-net]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: solar-alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9095:9093"
    networks: [solar-net]
    restart: unless-stopped

  # Relay convert Alertmanager webhook JSON → Discord native JSON.
  # Discord /slack endpoint từ chối format attachments của Alertmanager.
  # Service này nhỏ (~10MB) chỉ làm reformatter.
  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    # Image upstream chỉ có build cho linux/amd64 (không multi-arch).
    # Khai báo platform explicit để Docker emulate qua Rosetta trên Mac M-series
    # mà không phát sinh warning "platform mismatch" mỗi lần up.
    # Trade-off: slower 2-5x so với native ARM64 nhưng acceptable vì relay nhỏ và idle hầu hết thời gian.
    platform: linux/amd64
    container_name: solar-alertmanager-discord
    # `env_file` inject trực tiếp DISCORD_WEBHOOK từ .env.Docker vào container env
    # (relay đợi đúng tên DISCORD_WEBHOOK, không phải DISCORD_WEBHOOK_URL).
    # Lưu ý: ${VAR} trong YAML chỉ resolve từ .env (root) hoặc shell, KHÔNG từ .env.Docker.
    env_file:
      - .env.Docker
    networks: [solar-net]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: solar-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks: [solar-net]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: solar-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # 8081 is Expo Metro's default port; keep cAdvisor available without blocking mobile dev.
      - "8082:8080"
    networks: [solar-net]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: solar-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Password12345@}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: solar-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks: [solar-net]
    restart: unless-stopped

  # =====================================================================
  # ---------- Logging Stack (Loki + Promtail) ----------
  # =====================================================================
  # Truy cập:
  #   - Loki:     http://localhost:3100/ready    (health check)
  #   - Promtail: http://localhost:9080          (UI + targets)
  # Grafana auto-load Loki làm datasource thứ 2 (xem provisioning/datasources/).
  # =====================================================================

  loki:
    image: grafana/loki:latest
    container_name: solar-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    # Loki image là distroless — không có shell/wget/curl → không thể CMD-SHELL.
    # Bỏ healthcheck, dùng depends_on without condition (chỉ đợi container start).
    networks: [solar-net]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: solar-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      # Đọc Docker daemon API để discover containers + đọc log streams.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Đọc log files (fallback nếu Docker daemon API không stream được).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "9080:9080"          # /metrics + /targets UI cho debug
    depends_on:
      - loki
    networks: [solar-net]
    restart: unless-stopped
