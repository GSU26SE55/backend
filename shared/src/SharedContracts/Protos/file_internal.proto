syntax = "proto3";
option csharp_namespace = "SharedContracts.Grpc.FileInternal";
package file_internal.v1;
service FileInternal {
  rpc DownloadForTranscription(DownloadForTranscriptionRequest) returns (stream DownloadFileReply);
  // GH-790 — kênh tải file nội bộ dùng chung giữa các service (virus scan, và các nhu cầu
  // service-to-service sau này).
  // THÊM rpc mới chứ KHÔNG đổi tên rpc cũ: đổi tên là phá hợp đồng dây, và trong lúc cuốn chiếu
  // deploy sẽ có pod TicketService bản cũ gọi FileStorageService bản mới.
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileReply);
}
message DownloadForTranscriptionRequest { string file_id = 1; }
message DownloadFileRequest { string file_id = 1; }
message DownloadFileReply { bytes chunk = 1; string content_type = 2; string file_name = 3; int64 total_size = 4; }
